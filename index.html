<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="ARENA LIVE - Live scores and fixtures from every football league in the world.">
  <title>ARENA LIVE | Football Matches</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>

<header class="nav-wrap">
  <nav class="nav" aria-label="Main">
    <a href="#top" class="logo">ARENA<span>LIVE</span></a>
    <span class="nav__sep"></span>
    <a href="#top" class="nav__link is-active">Home</a>
    <a href="#live" class="nav__link">Live <i class="dot"></i></a>
    <a href="#matches" class="nav__link">Matches</a>
    <span class="nav__sep"></span>
    <button class="nav__icon" id="searchToggle" type="button" aria-label="Search">⌕</button>
  </nav>
</header>

<main id="top">

  <section class="hero" id="hero" aria-live="polite"></section>

  <h1 class="page-title" id="matches"><span></span>Matches</h1>

  <div class="toolbar">
    <div class="search" id="searchBox">
      <input id="searchInput" type="search" placeholder="Search a team or a league…" autocomplete="off">
    </div>

    <div class="datebar">
      <button id="prevDay" class="round" type="button" aria-label="Previous day">‹</button>
      <input type="date" id="matchDate" aria-label="Match date">
      <button id="nextDay" class="round" type="button" aria-label="Next day">›</button>
      <button id="todayBtn" class="pill" type="button">Today</button>
    </div>
  </div>

  <div class="pills" id="statusPills" role="group" aria-label="Status">
    <button class="pill is-on" data-status="all" type="button">All</button>
    <button class="pill" data-status="live" type="button">Live now</button>
    <button class="pill" data-status="upcoming" type="button">Upcoming</button>
    <button class="pill" data-status="finished" type="button">Finished</button>
  </div>

  <div class="pills pills--scroll" id="leaguePills" role="group" aria-label="Competitions"></div>

  <div class="status-line">
    <span id="matchCount">Loading…</span>
    <span id="lastUpdated"></span>
  </div>

  <div id="message" class="message"></div>

  <section id="live" class="block" hidden>
    <h2 class="block__title">Live Now</h2>
    <div class="grid" id="liveGrid"></div>
  </section>

  <div id="leagues"></div>

</main>

<footer class="footer">
  <p>© 2026 ARENA LIVE. Scores and fixtures only. We do not host or stream any match: for viewing, we point you to the official broadcasters.</p>
</footer>

<dialog class="modal" id="modal" aria-labelledby="mTitle">
  <div id="modalBody"></div>
</dialog>

<script src="./config.js?v=2"></script>
<script src="./sources.js?v=2"></script>
<script src="./app.js?v=2"></script>
</body>
</html>
