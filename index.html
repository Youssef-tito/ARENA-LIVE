<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Footime — Live Football, Teams, Players & Replays</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg-base: #070b0a;
      --bg-elevated: #0d1412;
      --bg-card: #121c19;
      --bg-hover: #182622;
      --fg-primary: #f4f8f6;
      --fg-secondary: #b7c7c1;
      --fg-tertiary: #798e87;
      --accent: #10b981;
      --accent-bright: #34d399;
      --accent-gold: #f59e0b;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --live-red: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--fg-primary);
      font-family: "Plus Jakarta Sans", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    h1, h2, h3 { font-family: "Outfit", sans-serif; }
    button, input, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 20px;
      background: rgba(7, 11, 10, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .arena-brand { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .arena-logo {
      width: 170px; height: 74px; object-fit: contain; display: block;
      transition: transform 0.25s, filter 0.25s;
      filter: drop-shadow(0 0 10px rgba(0, 255, 100, 0.28));
    }
    .arena-brand:hover .arena-logo {
      transform: scale(1.04);
      filter: drop-shadow(0 0 18px rgba(0, 255, 100, 0.6));
    }
    @media (max-width: 600px) { .arena-logo { width: 135px; height: 58px; } }

    .nav-pills {
      position: relative; display: flex; gap: 4px; padding: 4px;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px;
      overflow-x: auto; scrollbar-width: none;
    }
    .nav-pills::-webkit-scrollbar { display: none; }
    .nav-btn {
      position: relative; z-index: 2; padding: 8px 13px; border-radius: 999px;
      font-size: 12.5px; font-weight: 600; color: var(--fg-tertiary); white-space: nowrap;
    }
    .nav-btn.active { color: #04130e; }
    .nav-indicator {
      position: absolute; top: 4px; left: 4px; height: calc(100% - 8px); border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      transition: all 0.22s ease; z-index: 1;
    }

    .top-actions { display: flex; align-items: center; gap: 8px; }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 999px; padding: 8px 13px; width: 215px;
    }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box input { background: transparent; border: none; outline: none; font-size: 13px; width: 100%; }
    .icon-btn {
      padding: 8px 13px; border-radius: 999px;
      background: var(--bg-card); border: 1px solid var(--border);
      font-size: 12.5px; font-weight: 600; color: var(--fg-secondary); white-space: nowrap;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--fg-primary); }

    .container { max-width: 1360px; margin: 0 auto; padding: 22px; }
    .hero-card {
      position: relative; overflow: hidden; border-radius: 20px;
      background: linear-gradient(135deg, #0d241c 0%, #0b1310 55%, #161409 100%);
      border: 1px solid rgba(16, 185, 129, 0.22); padding: 26px; margin-bottom: 20px;
    }
    .hero-glow {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      opacity: 0.2; filter: blur(18px); pointer-events: none;
    }
    .hero-content { position: relative; z-index: 2; max-width: 760px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 999px; font-size: 11px; font-weight: 700; margin-right: 8px; margin-bottom: 10px;
    }
    .badge-live { background: rgba(239, 68, 68, 0.16); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .badge-up { background: rgba(245, 158, 11, 0.16); border: 1px solid rgba(245, 158, 11, 0.4); color: #fcd34d; }
    .badge-lg { background: var(--accent-soft); color: var(--accent-bright); }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live-red); box-shadow: 0 0 8px var(--live-red); }
    .hero-title { font-size: clamp(22px, 3.4vw, 34px); font-weight: 800; margin-bottom: 8px; }
    .hero-sub { color: var(--fg-secondary); font-size: 13.5px; margin-bottom: 14px; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #03120d; font-weight: 700; font-size: 13px; text-decoration: none;
    }

    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      padding: 8px 14px; border-radius: 999px; background: var(--bg-card);
      border: 1px solid var(--border); font-size: 12.5px; font-weight: 600;
      color: var(--fg-secondary); white-space: nowrap;
    }
    .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-bright); }
    .chip.tn.active { background: rgba(245, 158, 11, 0.16); border-color: var(--accent-gold); color: #fcd34d; }

    .section-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; margin: 22px 0 12px; }
    .bar { width: 4px; height: 18px; border-radius: 999px; background: linear-gradient(180deg, var(--accent-bright), var(--accent-gold)); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }

    .card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(16, 185, 129, 0.45); }
    .banner { position: relative; aspect-ratio: 16 / 9; background: #0b1210; overflow: hidden; cursor: pointer; }
    .banner img { width: 100%; height: 100%; object-fit: cover; opacity: 0.75; }
    .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7, 11, 10, 0.15), rgba(7, 11, 10, 0.88)); }
    .pill {
      position: absolute; top: 10px; left: 10px; z-index: 2; padding: 4px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; background: rgba(7, 11, 10, 0.8);
      border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 5px;
    }
    .fav {
      position: absolute; top: 10px; right: 10px; z-index: 3; width: 30px; height: 30px;
      border-radius: 50%; display: grid; place-items: center;
      background: rgba(7, 11, 10, 0.8); border: 1px solid var(--border); color: var(--fg-tertiary);
    }
    .fav.on { color: var(--accent-gold); border-color: rgba(245, 158, 11, 0.5); }
    .body { padding: 13px; cursor: pointer; }
    .lg { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent-bright); }
    .title { font-size: 14.5px; font-weight: 700; margin: 4px 0; }
    .sub { font-size: 12px; color: var(--fg-tertiary); }

    .team-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
      padding: 13px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s;
    }
    .team-card:hover { border-color: var(--accent); background: var(--bg-hover); }
    .team-badge {
      width: 48px; height: 48px; border-radius: 12px; background: var(--bg-elevated);
      display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
      font-weight: 800; font-size: 12.5px; color: var(--accent-bright);
      border: 1px solid var(--border);
    }
    .team-badge img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }

    .player-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; transition: transform 0.2s, border-color 0.2s;
      display: flex; flex-direction: column;
    }
    .player-card:hover { transform: translateY(-3px); border-color: rgba(16, 185, 129, 0.5); }
    .player-photo-frame {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      background: radial-gradient(circle at top, rgba(16, 185, 129, 0.18), var(--bg-elevated));
      border-bottom: 1px solid var(--border); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .player-photo-frame img {
      width: 100%; height: 100%; object-fit: cover; object-position: top center;
      display: block;
    }
    .player-fallback {
      font-family: "Outfit", sans-serif; font-size: 28px; font-weight: 800;
      color: var(--accent-bright); opacity: 0.75;
    }
    .player-pos-tag {
      position: absolute; bottom: 8px; left: 8px;
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
      background: rgba(7, 11, 10, 0.85); border: 1px solid rgba(52, 211, 153, 0.35);
      color: var(--accent-bright);
    }
    .player-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .player-name { font-size: 16px; font-weight: 700; line-height: 1.25; }
    .player-meta-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px;
      font-size: 12px; color: var(--fg-secondary);
    }
    .player-stat-box {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 8px;
    }
    .player-stat-lbl { display: block; font-size: 10px; text-transform: uppercase; color: var(--fg-tertiary); }
    .player-stat-val { font-weight: 700; color: var(--fg-primary); font-size: 12px; }

    .ch-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
      padding: 13px; display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .ch-card:hover { border-color: var(--accent); }
    .ch-logo {
      width: 54px; height: 38px; border-radius: 8px; background: var(--bg-elevated);
      display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
      font-size: 11px; font-weight: 700; color: var(--fg-tertiary);
    }
    .ch-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .tv-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
    .select { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
    .inline-input {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 13px; font-size: 13px; min-width: 220px; outline: none;
    }
    .inline-input:focus { border-color: var(--accent); }
    .note {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 12px; padding: 11px 15px; font-size: 12.5px; color: var(--fg-secondary); margin-bottom: 16px;
    }
    .empty {
      grid-column: 1 / -1; text-align: center; padding: 36px 18px;
      background: var(--bg-card); border: 1px dashed var(--border); border-radius: 14px; color: var(--fg-tertiary);
    }

    .modal {
      position: fixed; inset: 0; z-index: 100; background: rgba(3, 6, 5, 0.86);
      backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 14px;
    }
    .modal.open { display: flex; }
    .box {
      width: 100%; max-width: 940px; background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
      max-height: 92vh; display: flex; flex-direction: column;
    }
    .m-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-bottom: 1px solid var(--border); }
    .m-scroll { overflow-y: auto; }
    .stage { aspect-ratio: 16 / 9; background: #000; width: 100%; }
    .stage iframe, .stage video { width: 100%; height: 100%; border: 0; }
    .m-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 11px 18px; border-top: 1px solid var(--border); background: var(--bg-card);
    }
    .m-yt {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 18px; border-top: 1px solid var(--border); background: var(--bg-elevated);
    }
    .yt-in {
      flex: 1; min-width: 200px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 11px; font-size: 12px; outline: none;
    }
    .yt-in:focus { border-color: var(--accent); }
    .s-btn {
      padding: 6px 12px; border-radius: 8px; background: var(--bg-elevated);
      border: 1px solid var(--border); font-size: 12px; font-weight: 600;
      color: var(--fg-secondary); text-decoration: none;
    }
    .s-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-bright); }
    .ext { margin-left: auto; color: var(--accent-gold); border-color: rgba(245, 158, 11, 0.35); }
    .t-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; margin-bottom: 8px; border-radius: 10px;
      background: var(--bg-card); border: 1px solid var(--border); font-size: 13px;
    }

    @media (max-width: 780px) {
      .topbar { flex-wrap: wrap; padding: 8px 14px; }
      .nav-pills { order: 3; width: 100%; }
      .search-box { width: 155px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="#matches" class="arena-brand" id="brandHome">
      <svg class="arena-logo" viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gE" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#047857"/></linearGradient>
          <linearGradient id="gG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
          <linearGradient id="gB" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f261e"/><stop offset="100%" stop-color="#08120e"/></linearGradient>
        </defs>
        <g transform="translate(10,13)">
          <rect x="2" y="2" width="80" height="80" rx="22" fill="url(#gB)" stroke="url(#gE)" stroke-width="2.5"/>
          <path d="M25 58 L42 22 L59 58" fill="none" stroke="url(#gE)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M31 46 H53" stroke="url(#gG)" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="67" cy="21" r="6" fill="#ef4444"/>
        </g>
        <text x="102" y="54" fill="#f4f8f6" font-family="Outfit,sans-serif" font-size="25" font-weight="800">ARENA <tspan fill="url(#gE)">LIVE</tspan></text>
        <text x="103" y="76" fill="url(#gG)" font-family="Plus Jakarta Sans,sans-serif" font-size="11" font-weight="700" letter-spacing="2.4">FOOTIME SPORTS</text>
      </svg>
    </a>

    <nav class="nav-pills" id="navPills">
      <div class="nav-indicator" id="navInd"></div>
      <button class="nav-btn active" data-tab="matches">Matches &amp; Live</button>
      <button class="nav-btn" data-tab="teams">World Teams</button>
      <button class="nav-btn" data-tab="players">Players</button>
      <button class="nav-btn" data-tab="replays">Replays &amp; Highlights</button>
      <button class="nav-btn" data-tab="channels">Live Channels</button>
      <button class="nav-btn" data-tab="favorites">Favorites (<span id="favCount">0</span>)</button>
    </nav>

    <div class="top-actions">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search match, team, player..." autocomplete="off" />
      </div>
      <button class="icon-btn" id="refreshBtn">↻ Refresh</button>
    </div>
  </header>

  <main class="container" id="app"></main>

  <div class="modal" id="modal">
    <div class="box">
      <div class="m-head">
        <strong id="mTitle">Stream</strong>
        <button id="mClose" style="font-size:18px;padding:4px 8px;">✕</button>
      </div>
      <div class="m-scroll">
        <div id="mBody"></div>
        <div class="m-bar" id="mBar" style="display:none;"></div>
        <div class="m-yt" id="mYt" style="display:none;">
          <a class="s-btn active" id="ytSearchLink" target="_blank" rel="noopener noreferrer">▶ Search on YouTube</a>
          <input class="yt-in" id="ytUrlInput" type="text" placeholder="Paste YouTube or embed link to play here..." />
          <button class="s-btn active" id="ytPlayBtn">Load Link</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WORKER_API = "https://arena-live.youssefmehrzi666.workers.dev";
    const IPTV_API = "https://iptv-org.github.io/api";
    const SDB_API = "https://www.thesportsdb.com/api/v1/json/3";

    const ALIASES = {
      taraji: ["esperance", "es tunis", "taraji"],
      esperance: ["esperance", "es tunis", "taraji"],
      lifri9i: ["club africain", "africain", "ca"],
      africain: ["club africain", "africain", "ca"],
      etoile: ["etoile", "sahel", "ess"],
      sfaxien: ["sfaxien", "cs sfaxien", "css"],
      monastir: ["monastir", "us monastir", "usmo"],
      bizerte: ["bizerte", "ca bizertin", "cab"]
    };

    const SPORTS = [
      { id: "Football", label: "Football" },
      { id: "tunisia", label: "🇹🇳 Tunisian League", tn: 1 },
      { id: "all", label: "All Sports" },
      { id: "Basketball", label: "Basketball" },
      { id: "Combat Sports", label: "Combat Sports" },
      { id: "American Football", label: "American Football" },
      { id: "Tennis", label: "Tennis" },
      { id: "Cricket", label: "Cricket" },
      { id: "Motorsport", label: "Motorsport" }
    ];

    const LEAGUE_TABS = [
      { id: "all", label: "All Teams", leagueId: null, name: "" },
      { id: "tunisia", label: "🇹🇳 Tunisia", leagueId: "4445", name: "Tunisian Ligue 1", tn: 1 },
      { id: "epl", label: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League", leagueId: "4328", name: "English Premier League" },
      { id: "laliga", label: "🇪🇸 La Liga", leagueId: "4335", name: "Spanish La Liga" },
      { id: "seriea", label: "🇮🇹 Serie A", leagueId: "4332", name: "Italian Serie A" },
      { id: "bundesliga", label: "🇩🇪 Bundesliga", leagueId: "4331", name: "German Bundesliga" },
      { id: "ligue1", label: "🇫🇷 Ligue 1", leagueId: "4334", name: "French Ligue 1" }
    ];

    const FEATURED_PLAYERS = [
      "Mohamed Salah", "Kylian Mbappe", "Erling Haaland", "Vinicius Junior",
      "Jude Bellingham", "Lamine Yamal", "Achraf Hakimi", "Youssef Msakni"
    ];

    const ST = {
      tab: "matches",
      sport: "Football",
      teamFilter: "all",
      leagueFixtures: [],
      q: "",
      playerQuery: "",
      matches: [],
      tnMatches: [],
      teams: [],
      players: [],
      channels: [],
      country: "all",
      cat: "all",
      favs: JSON.parse(localStorage.getItem("footime_favs") || '{"matches":[],"channels":[]}'),
      hls: null
    };

    const esc = s => String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    function fetchJsonTimeout(url, ms = 7000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      return fetch(url, { signal: ctrl.signal })
        .then(r => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .finally(() => clearTimeout(timer));
    }

    function toEmbedUrl(raw) {
      const u = (raw || "").trim();
      if (!u) return "";
      const m1 = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{6,})/);
      if (m1) return `https://www.youtube.com/embed/${m1[1]}?autoplay=1`;
      return u;
    }

    function expandTerms(rawQ) {
      const q = (rawQ || "").trim().toLowerCase();
      if (!q) return [];
      return [q, ...(ALIASES[q] || [])];
    }

    function matchQ(item, customQ = null) {
      const q = (customQ ?? ST.q).trim().toLowerCase();
      if (!q) return true;
      const hay = `${item.title || ""} ${item.name || ""} ${item.strPlayer || ""} ${item.league || ""} ${item.strLeague || ""} ${item.strTeam || ""} ${item.category || ""}`.toLowerCase();
      return expandTerms(q).some(t => hay.includes(t));
    }

    function saveFavs() {
      localStorage.setItem("footime_favs", JSON.stringify(ST.favs));
      document.getElementById("favCount").textContent = ST.favs.matches.length + ST.favs.channels.length;
    }

    function toggleFav(type, obj) {
      const list = ST.favs[type];
      const key = String(obj.id ?? obj.title);
      const i = list.findIndex(x => String(x.id ?? x.title) === key);

    function statusOf(s, now = Date.now()) {
      if (s.always_live) return "live";
      const st = (s.starts_at || 0) * 1000;
      const en = (s.ends_at || 0) * 1000;
      if (!st) return "live";
      if (now < st) return "upcoming";
      if (en && now > en) return "ended";
      return "live";
    }

    function mapEvent(ev, fallbackLeague = "Football") {
      const ts = ev.strTimestamp ? Math.floor(new Date(ev.strTimestamp).getTime() / 1000) : 0;
      const hasScore = ev.intHomeScore != null && ev.intAwayScore != null;
      return {
        id: "ev_" + ev.idEvent,
        title: ev.strEvent || "Match",
        league: ev.strLeague || fallbackLeague,
        category: "Football",
        poster: ev.strThumb || "",
        starts_at: ts,
        ends_at: hasScore && ts ? ts + 7200 : 0,
        score: hasScore ? `${ev.intHomeScore} - ${ev.intAwayScore}` : "",
        videoUrl: ev.strVideo || ""
      };
    }

    async function loadFallbackFixtures() {
      const ids = ["4328", "4335", "4445"];
      const out = [];
      for (const id of ids) {
        try {
          const [nx, ps] = await Promise.all([
            fetchJsonTimeout(`${SDB_API}/eventsnextleague.php?id=${id}`).catch(() => ({})),
            fetchJsonTimeout(`${SDB_API}/eventspastleague.php?id=${id}`).catch(() => ({}))
          ]);
          for (const ev of [...(nx.events || []), ...(ps.events || [])]) {
            if (ev?.idEvent) out.push(mapEvent(ev, ev.strLeague || "Football"));
          }
        } catch {}
      }
      return out;
    }

    async function loadMatches(force = false) {
      if (!force && ST.matches.length) { render(); return; }
      document.getElementById("app").innerHTML = `<div class="empty">Loading matches...</div>`;

      const today = new Date().toISOString().slice(0, 10);

      try {
        const wData = await fetchJsonTimeout(`${WORKER_API}/?date=${today}`, 7000);
        if (wData && Array.isArray(wData.matches) && wData.matches.length) {
          ST.matches = wData.matches.map((m, idx) => {
            const ts = m.time ? Math.floor(new Date(m.time).getTime() / 1000) : 0;
            const hasScore = m.homeGoals != null && m.awayGoals != null;
            const isLive = ["1H", "2H", "HT", "ET", "P", "LIVE"].includes(String(m.status || "").toUpperCase());
            const isEnded = ["FT", "AET", "PEN"].includes(String(m.status || "").toUpperCase());
            return {
              id: m.id || `w_${idx}`,
              title: `${m.home || "Home"} vs ${m.away || "Away"}`,
              league: m.league || "Football",
              category: "Football",
              poster: m.homeLogo || m.leagueLogo || "",
              starts_at: ts,
              ends_at: isEnded && ts ? ts + 7200 : 0,
              always_live: isLive,
              score: hasScore ? `${m.homeGoals} - ${m.awayGoals}` : ""
            };
          });
          render();
          return;
        }
      } catch {}

      const fallback = await loadFallbackFixtures();
      ST.matches = fallback;
      render();
    }

    async function searchTeamAndMatchesOnline(rawQuery) {
      const q = (rawQuery || "").trim();
      if (!q) return;
      const terms = expandTerms(q);
      const collected = [];
      for (const term of terms.slice(0, 2)) {
        try {
          const d = await fetchJsonTimeout(`${SDB_API}/searchteams.php?t=${encodeURIComponent(term)}`);
          const tMap = new Map(ST.teams.map(t => [t.id, t]));
          for (const tm of (d.teams || [])) {
            if (!tm.idTeam) continue;
            if (!tMap.has(tm.idTeam)) {
              tMap.set(tm.idTeam, {
                id: tm.idTeam,
                name: tm.strTeam,
                filterKey: (tm.strLeague || "").toLowerCase().includes("tunisia") ? "tunisia" : "all",
                leagueLabel: tm.strLeague || "World Team",
                badge: tm.strBadge || "",
                country: tm.strCountry || ""
              });
            }
            const [nx, ls] = await Promise.all([
              fetchJsonTimeout(`${SDB_API}/eventsnext.php?id=${tm.idTeam}`).catch(() => ({})),
              fetchJsonTimeout(`${SDB_API}/eventslast.php?id=${tm.idTeam}`).catch(() => ({}))
            ]);
            for (const ev of [...(nx.events || []), ...(ls.results || [])]) {
              collected.push(mapEvent(ev, tm.strLeague || tm.strTeam));
            }
          }
          ST.teams = [...tMap.values()];
        } catch {}
      }
      if (collected.length) {
        const exMap = new Map(ST.tnMatches.map(m => [m.id, m]));
        for (const m of collected) exMap.set(m.id, m);
        ST.tnMatches = [...exMap.values()];
      }
      render();
    }

    async function loadChannels(force = false) {
      if (!force && ST.channels.length) { render(); return; }
      document.getElementById("app").innerHTML = `<div class="empty">Loading channels...</div>`;
      try {
        const [chs, sts, lgs] = await Promise.all([
          fetchJsonTimeout(`${IPTV_API}/channels.json`, 9000),
          fetchJsonTimeout(`${IPTV_API}/streams.json`, 9000),
          fetchJsonTimeout(`${IPTV_API}/logos.json`, 9000).catch(() => [])
        ]);
        const logoMap = new Map();
        for (const l of lgs) if (l.channel && l.url && !logoMap.has(l.channel)) logoMap.set(l.channel, l.url);
        const stMap = new Map();
        for (const s of sts) {
          if (!s.channel || !s.url || (s.status && s.status !== "online")) continue;
          if (!stMap.has(s.channel)) stMap.set(s.channel, []);
          stMap.get(s.channel).push(s.url);
        }
        ST.channels = chs.filter(c => c.id && stMap.has(c.id)).map(c => ({
          id: c.id,
          name: c.name || c.id,
          logo: logoMap.get(c.id) || "",
          streams: stMap.get(c.id),
          country: (c.country || "").toUpperCase(),
          category: Array.isArray(c.categories) ? (c.categories[0] || "general") : (c.category || "general")
        }));
        render();
      } catch {
        document.getElementById("app").innerHTML = `<div class="empty">Failed to load channels. <button class="btn-primary" onclick="loadChannels(true)">Retry</button></div>`;

      destroyHls();
      document.getElementById("modal").classList.remove("open");
      document.getElementById("mBody").innerHTML = "";
      document.getElementById("mBar").style.display = "none";
      document.getElementById("mYt").style.display = "none";

    function openMatch(m) {
      const sources = [];
      if (m.iframe) sources.push({ label: `${(m.locale || "EN").toUpperCase()} • ${m.source_tag || "Main"}`, url: m.iframe });
      (m.substreams || []).forEach((sub, i) => sub.iframe && sources.push({ label: `${(sub.locale || m.locale || "EN").toUpperCase()} • ${sub.source_tag || sub.name || "Backup " + (i + 1)}`, url: sub.iframe }));
      if (m.videoUrl) sources.push({ label: "Highlight / Video", url: toEmbedUrl(m.videoUrl) });

      const body = document.getElementById("mBody");
      const bar = document.getElementById("mBar");
      const ytRow = document.getElementById("mYt");
      document.getElementById("mTitle").textContent = m.title + (m.score ? ` (${m.score})` : "");
      destroyHls();
      document.getElementById("modal").classList.add("open");

      ytRow.style.display = "flex";
      document.getElementById("ytSearchLink").href = `https://www.youtube.com/results?search_query=${encodeURIComponent(m.title + " highlights replay")}`;
      const ytInput = document.getElementById("ytUrlInput");
      ytInput.value = "";
      document.getElementById("ytPlayBtn").onclick = () => {
        const emb = toEmbedUrl(ytInput.value);
        if (!emb) return;
        body.innerHTML = `<div class="stage"><iframe src="${esc(emb)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>`;
      };

      if (!sources.length) {
        bar.style.display = "none";
        body.innerHTML = `<div style="padding:24px;"><div class="empty">No automatic stream URL attached. Use "Search on YouTube" below or paste a YouTube/embed link.</div></div>`;
        return;
      }

      const playIdx = (i) => {
        const s = sources[i];
        body.innerHTML = `<div class="stage"><iframe src="${esc(s.url)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>`;
        bar.style.display = "flex";
        bar.innerHTML = sources.map((x, idx) => `<button class="s-btn ${idx === i ? "active" : ""}" data-i="${idx}">${esc(x.label)}</button>`).join("")
          + `<a class="s-btn ext" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Open in Tab ↗</a>`;
        bar.querySelectorAll("[data-i]").forEach(btn => btn.onclick = () => playIdx(+btn.dataset.i));
      };
      playIdx(0);
    }

    function openChannel(ch) {
      const list = ch.streams || [ch.url].filter(Boolean);
      const body = document.getElementById("mBody");
      const bar = document.getElementById("mBar");
      document.getElementById("mYt").style.display = "none";
      document.getElementById("mTitle").textContent = ch.name;
      destroyHls();
      document.getElementById("modal").classList.add("open");

      let idx = 0;
      const run = () => {
        const url = list[idx];
        destroyHls();
        bar.style.display = "flex";
        bar.innerHTML = `<span style="font-size:12px;color:var(--fg-tertiary);">Source ${idx + 1}/${list.length}</span>`
          + (list.length > 1 ? `<button class="s-btn active" id="nxSrc">Next Source ↻</button>` : "")
          + `<a class="s-btn ext" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open in Tab ↗</a>`;
        document.getElementById("nxSrc")?.addEventListener("click", () => { idx = (idx + 1) % list.length; run(); });

        if (/\.m3u8(\?|$)/i.test(url) && window.Hls && Hls.isSupported()) {
          body.innerHTML = `<div class="stage"><video id="vid" controls autoplay playsinline></video></div>`;
          const v = document.getElementById("vid");
          const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
          ST.hls = hls;
          hls.loadSource(url);
          hls.attachMedia(v);
          hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
          hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal && idx < list.length - 1) { idx++; run(); } });
        } else {
          body.innerHTML = `<div class="stage"><iframe src="${esc(url)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>`;
        }
      };
      run();
    }

          </div>` : ""}
          <h2 class="section-title"><span class="bar"></span> Live Now (${live.length})</h2>
          <div class="grid">${live.length ? live.map(m => matchCard(m, "live")).join("") : `<div class="empty">No live matches right now.</div>`}</div>
          <h2 class="section-title"><span class="bar"></span> Upcoming (${up.length})</h2>
          <div class="grid">${up.length ? up.slice(0, 24).map(m => matchCard(m, "upcoming")).join("") : `<div class="empty">No upcoming matches right now.</div>`}</div>
          ${isTn ? `<h2 class="section-title"><span class="bar"></span> Recent Results (${past.length})</h2>
          <div class="grid">${past.length ? past.slice(0, 24).map(m => matchCard(m, "ended")).join("") : `<div class="empty">No recent results returned.</div>`}</div>` : ""}
        `;
        app.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => {
          ST.sport = b.dataset.sp;
          if (ST.sport === "tunisia") loadTunisia();
          render();
        });
        document.getElementById("onlineMatchSearch")?.addEventListener("click", () => searchTeamAndMatchesOnline(ST.q));
        document.getElementById("clrQ")?.addEventListener("click", () => { ST.q = ""; document.getElementById("searchInput").value = ""; render(); });

      } else if (ST.tab === "teams") {
        const tList = ST.teams.filter(t => (ST.teamFilter === "all" || t.filterKey === ST.teamFilter) && matchQ(t));
        const fxList = ST.teamFilter === "all" ? [] : ST.leagueFixtures.filter(matchQ);

        app.innerHTML = `<h2 class="section-title"><span class="bar"></span> World Teams (${tList.length})</h2>
          <div class="filter-bar">
            ${LEAGUE_TABS.map(l => `<button class="chip ${l.tn ? "tn" : ""} ${ST.teamFilter === l.id ? "active" : ""}" data-tlg="${esc(l.id)}">${esc(l.label)}</button>`).join("")}
            <button class="chip active" id="findTeamOnline">🌐 Search Any Team Online</button>
          </div>
          <div class="grid">${tList.length ? tList.map(tm => {
            const enc = encodeURIComponent(JSON.stringify(tm));
            return `<div class="team-card" onclick="openTeamDetails(JSON.parse(decodeURIComponent('${enc}')))">
              <div class="team-badge">${tm.badge ? `<img src="${esc(tm.badge)}" loading="lazy" onerror="this.remove()">` : esc(tm.name.slice(0, 3).toUpperCase())}</div>
              <div style="flex:1;min-width:0;">
                <div class="title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(tm.name)}</div>
                <div class="sub">${esc(tm.leagueLabel)} ${tm.country ? "• " + esc(tm.country) : ""}</div>
              </div>
            </div>`;
          }).join("") : `<div class="empty">No teams found for this filter. Click "Search Any Team Online".</div>`}</div>

          ${ST.teamFilter !== "all" ? `
            <h2 class="section-title"><span class="bar"></span> League Matches &amp; Fixtures (${fxList.length})</h2>
            <div class="grid">${fxList.length ? fxList.slice(0, 24).map(m => matchCard(m, statusOf(m, now))).join("") : `<div class="empty">No matches returned for this league right now.</div>`}</div>
          ` : ""}`;

        app.querySelectorAll("[data-tlg]").forEach(b => b.onclick = () => {
          ST.teamFilter = b.dataset.tlg;
          loadLeagueFixtures(ST.teamFilter);
          render();
        });
        document.getElementById("findTeamOnline")?.addEventListener("click", () => searchTeamAndMatchesOnline(ST.q || "Esperance"));

      } else if (ST.tab === "players") {
        const activeQ = (ST.playerQuery || ST.q).trim();
        const pList = ST.players.filter(p => matchQ(p, activeQ));
        app.innerHTML = `<h2 class="section-title"><span class="bar"></span> World Players (${pList.length})</h2>
          <div class="tv-bar">
            <input class="inline-input" id="playerSearchInput" type="text" value="${esc(ST.playerQuery)}" placeholder="Type any player name (e.g. Messi, Salah, Msakni)..." />
            <button class="chip active" id="playerApiSearchBtn">🔍 Search Player</button>
          </div>
          <div class="grid">${pList.length ? pList.map(playerCard).join("") : `<div class="empty">No player loaded yet. Type a name and click "Search Player".</div>`}</div>`;

        const pInp = document.getElementById("playerSearchInput");
        pInp.oninput = e => { ST.playerQuery = e.target.value; render(); };
        pInp.onkeydown = e => { if (e.key === "Enter") searchPlayerOnline(ST.playerQuery || ST.q); };
        document.getElementById("playerApiSearchBtn").onclick = () => searchPlayerOnline(ST.playerQuery || ST.q);

      } else if (ST.tab === "replays") {
        const ended = [...ST.matches, ...ST.tnMatches, ...ST.leagueFixtures].filter(m => (statusOf(m, now) === "ended" || m.videoUrl || m.score) && matchQ(m));
        app.innerHTML = `<h2 class="section-title"><span class="bar"></span> Replays &amp; Highlights (${ended.length})</h2>
          <div class="grid">${ended.length ? ended.slice(0, 30).map(m => matchCard(m, "ended")).join("") : `<div class="empty">No replays or highlights available yet.</div>`}</div>`;

      } else if (ST.tab === "channels") {
        const q = ST.q.trim().toLowerCase();
        const countries = [...new Set(ST.channels.map(c => c.country).filter(Boolean))].sort();
        const cats = [...new Set(ST.channels.map(c => c.category).filter(Boolean))].sort();
        const chs = ST.channels.filter(c => (ST.country === "all" || c.country === ST.country) && (ST.cat === "all" || c.category === ST.cat) && (!q || (c.name || "").toLowerCase().includes(q))).slice(0, 90);
        app.innerHTML = `<h2 class="section-title"><span class="bar"></span> Live Channels</h2>
          <div class="tv-bar">
            <select class="select" id="selC"><option value="all">All Countries</option>${countries.map(c => `<option value="${esc(c)}" ${ST.country === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
            <select class="select" id="selK"><option value="all">All Categories</option>${cats.map(c => `<option value="${esc(c)}" ${ST.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
            <button class="chip ${ST.cat === "sports" ? "active" : ""}" id="qSp">⚽ Sports</button>
            <button class="chip tn ${ST.country === "TN" ? "active" : ""}" id="qTn">🇹🇳 Tunisia</button>
          </div>
          <div class="grid">${chs.length ? chs.map(ch => {
            const isFav = ST.favs.channels.some(x => String(x.id) === String(ch.id));
            const enc = encodeURIComponent(JSON.stringify(ch));
            return `<div class="ch-card" onclick="openChannel(JSON.parse(decodeURIComponent('${enc}')))">
              <div class="ch-logo">${ch.logo ? `<img src="${esc(ch.logo)}" loading="lazy" onerror="this.remove()">` : "TV"}</div>
              <div style="flex:1;min-width:0;"><div class="title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(ch.name)}</div><div class="sub">${esc(ch.country || "INTL")} • ${esc(ch.category)}</div></div>
              <button class="fav ${isFav ? "on" : ""}" style="position:static;" onclick="event.stopPropagation();toggleFav('channels',JSON.parse(decodeURIComponent('${enc}')))">★</button>
            </div>`;
          }).join("") : `<div class="empty">No channels found.</div>`}</div>`;
        document.getElementById("selC").onchange = e => { ST.country = e.target.value; render(); };
        document.getElementById("selK").onchange = e => { ST.cat = e.target.value; render(); };
        document.getElementById("qSp").onclick = () => { ST.cat = ST.cat === "sports" ? "all" : "sports"; render(); };
        document.getElementById("qTn").onclick = () => { ST.country = ST.country === "TN" ? "all" : "TN"; render(); };

      } else {
        app.innerHTML = `<h2 class="section-title"><span class="bar"></span> Favorite Matches (${ST.favs.matches.length})</h2>
          <div class="grid">${ST.favs.matches.length ? ST.favs.matches.map(m => matchCard(m, statusOf(m, now))).join("") : `<div class="empty">No favorite matches yet.</div>`}</div>
          <h2 class="section-title"><span class="bar"></span> Favorite Channels (${ST.favs.channels.length})</h2>
          <div class="grid">${ST.favs.channels.length ? ST.favs.channels.map(ch => {
            const enc = encodeURIComponent(JSON.stringify(ch));
            return `<div class="ch-card" onclick="openChannel(JSON.parse(decodeURIComponent('${enc}')))">
              <div class="ch-logo">${ch.logo ? `<img src="${esc(ch.logo)}">` : "TV"}</div>
              <div style="flex:1;"><div class="title">${esc(ch.name)}</div><div class="sub">${esc(ch.country || "INTL")} • ${esc(ch.category)}</div></div>
              <button class="fav on" style="position:static;" onclick="event.stopPropagation();toggleFav('channels',JSON.parse(decodeURIComponent('${enc}')))">★</button>
            </div>`;
          }).join("") : `<div class="empty">No favorite channels yet.</div>`}</div>`;
      }
    }

    document.querySelectorAll("#navPills .nav-btn").forEach(b => b.onclick = () => {
      ST.tab = b.dataset.tab;
      document.querySelectorAll("#navPills .nav-btn").forEach(x => x.classList.toggle("active", x === b));
      moveInd();
      render();
      if (ST.tab === "teams" && !ST.teams.length) loadTeams();
      if (ST.tab === "players" && !ST.players.length) loadPlayers();
      if (ST.tab === "channels" && !ST.channels.length) loadChannels();
      if (ST.sport === "tunisia" && !ST.tnMatches.length) loadTunisia();
    });
    document.getElementById("brandHome").onclick = e => { e.preventDefault(); document.querySelector('[data-tab="matches"]').click(); };
    document.getElementById("searchInput").oninput = e => { ST.q = e.target.value; render(); };
    document.getElementById("searchInput").onkeydown = e => {
      if (e.key === "Enter" && ST.q.trim()) {
        if (ST.tab === "players") searchPlayerOnline(ST.q);
        else searchTeamAndMatchesOnline(ST.q);
      }
    };
    document.getElementById("refreshBtn").onclick = () => {
      if (ST.tab === "channels") loadChannels(true);
      else if (ST.tab === "teams") loadTeams(true);
      else if (ST.tab === "players") loadPlayers(true);
      else { loadMatches(true); if (ST.sport === "tunisia") loadTunisia(true); }
    };
    document.getElementById("mClose").onclick = closeModal;
    document.getElementById("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
    window.onresize = moveInd;

    saveFavs();
    moveInd();
    loadMatches();
  </script>
</body>
</html>
