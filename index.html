<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Footime Pro — Live Football, World Teams, Replays & TV Hub | Created by Youssef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg-base: #060a09;
      --bg-elevated: #0c1311;
      --bg-card: #111b18;
      --bg-hover: #172521;
      --bg-input: #0a100e;
      --fg-primary: #f5f9f7;
      --fg-secondary: #b9cac4;
      --fg-tertiary: #7b9089;
      --accent: #10b981;
      --accent-bright: #34d399;
      --accent-deep: #047857;
      --accent-gold: #f59e0b;
      --accent-gold-bright: #fbbf24;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --live-red: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.35);
      --shadow-glow: 0 8px 24px rgba(16, 185, 129, 0.24);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --radius-hero: 20px;
      --radius-pill: 999px;
      --transition-fast: 0.18s ease;
      --transition-med: 0.25s ease;
    }

    html[data-theme="light"] {
      --bg-base: #f2f7f5;
      --bg-elevated: #ffffff;
      --bg-card: #f8fbfa;
      --bg-hover: #e8f1ed;
      --bg-input: #eef4f1;
      --fg-primary: #0b1612;
      --fg-secondary: #2e433b;
      --fg-tertiary: #5d746b;
      --accent: #059669;
      --accent-bright: #10b981;
      --accent-deep: #065f46;
      --accent-gold: #d97706;
      --accent-gold-bright: #f59e0b;
      --accent-soft: rgba(5, 150, 105, 0.12);
      --live-red: #dc2626;
      --border: rgba(11, 22, 18, 0.1);
      --border-strong: rgba(11, 22, 18, 0.2);
      --shadow-card: 0 10px 24px rgba(11, 22, 18, 0.08);
      --shadow-glow: 0 8px 20px rgba(5, 150, 105, 0.18);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at 12% 0%, rgba(16, 185, 129, 0.11), transparent 42%),
        radial-gradient(circle at 88% 8%, rgba(245, 158, 11, 0.08), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.05), transparent 50%),
        var(--bg-base);
      color: var(--fg-primary);
      font-family: "Plus Jakarta Sans", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.45;
      transition: background-color var(--transition-med), color var(--transition-med);
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: "Outfit", sans-serif;
      letter-spacing: -0.01em;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Topbar & Navigation */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 22px;
      background: rgba(6, 10, 9, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    html[data-theme="light"] .topbar {
      background: rgba(255, 255, 255, 0.9);
    }

    .arena-brand {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .arena-logo {
      width: 215px;
      height: 68px;
      object-fit: contain;
      display: block;
      transition: transform var(--transition-med), filter var(--transition-med);
      filter: drop-shadow(0 6px 16px rgba(16, 185, 129, 0.24));
    }

    .arena-brand:hover .arena-logo {
      transform: translateY(-1px) scale(1.03);
      filter: drop-shadow(0 8px 22px rgba(52, 211, 153, 0.44));
    }

    @media (max-width: 600px) {
      .arena-logo {
        width: 168px;
        height: 54px;
      }
    }

    .nav-pills {
      position: relative;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-pills::-webkit-scrollbar {
      display: none;
    }

    .nav-btn {
      position: relative;
      z-index: 2;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      color: var(--fg-tertiary);
      white-space: nowrap;
      transition: color var(--transition-fast);
    }

    .nav-btn:hover {
      color: var(--fg-secondary);
    }

    .nav-btn.active {
      color: #04130e;
    }

    .nav-indicator {
      position: absolute;
      top: 4px;
      left: 4px;
      height: calc(100% - 8px);
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      transition: all var(--transition-med);
      z-index: 1;
      box-shadow: 0 2px 12px rgba(16, 185, 129, 0.35);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 8px 13px;
      width: 215px;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 13px;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--fg-tertiary);
    }

    .icon-btn {
      padding: 8px 13px;
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--fg-secondary);
      white-space: nowrap;
      transition: border-color var(--transition-fast), color var(--transition-fast), background var(--transition-fast);
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--fg-primary);
      background: var(--bg-hover);
    }

    /* Layout & Cards */
    .container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 22px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-hero);
      background: linear-gradient(135deg, #0d261d 0%, #0a120f 55%, #171409 100%);
      border: 1px solid rgba(16, 185, 129, 0.24);
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    html[data-theme="light"] .hero-card {
      background: linear-gradient(135deg, #dcfce7 0%, #f0fdf4 55%, #fef3c7 100%);
      border-color: rgba(5, 150, 105, 0.25);
    }

    .hero-glow {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.22;
      filter: blur(18px);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 780px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      margin-right: 8px;
      margin-bottom: 10px;
    }

    .badge-live {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    html[data-theme="light"] .badge-live {
      color: #991b1b;
    }

    .badge-up {
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fcd34d;
    }

    html[data-theme="light"] .badge-up {
      color: #92400e;
    }

    .badge-lg {
      background: var(--accent-soft);
      color: var(--accent-bright);
    }

    html[data-theme="light"] .badge-lg {
      color: var(--accent-deep);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live-red);
      box-shadow: 0 0 8px var(--live-red);
      animation: pulseLive 1.6s infinite;
    }

    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.2); }
    }

    .hero-title {
      font-size: clamp(22px, 3.4vw, 36px);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .hero-sub {
      color: var(--fg-secondary);
      font-size: 13.5px;
      margin-bottom: 16px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #03120d;
      font-weight: 700;
      font-size: 13px;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-glow);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--fg-secondary);
      white-space: nowrap;
      transition: all var(--transition-fast);
    }

    .chip:hover {
      border-color: rgba(52, 211, 153, 0.35);
      color: var(--fg-primary);
    }

    .chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-bright);
    }

    .chip.tn.active {
      background: rgba(245, 158, 11, 0.16);
      border-color: var(--accent-gold);
      color: #fcd34d;
    }

    html[data-theme="light"] .chip.tn.active {
      color: #92400e;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      margin: 22px 0 12px;
    }

    .bar {
      width: 4px;
      height: 18px;
      border-radius: var(--radius-pill);
      background: linear-gradient(180deg, var(--accent-bright), var(--accent-gold));
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 15px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(16, 185, 129, 0.45);
      box-shadow: var(--shadow-card);
    }

    .banner {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0b1210;
      overflow: hidden;
      cursor: pointer;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.78;
      transition: transform var(--transition-med), opacity var(--transition-med);
    }

    .card:hover .banner img {
      transform: scale(1.03);
      opacity: 0.9;
    }

    .scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 11, 10, 0.15), rgba(7, 11, 10, 0.9));
    }

    .pill {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      padding: 4px 9px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      background: rgba(7, 11, 10, 0.82);
      color: #f5f9f7;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .fav {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(7, 11, 10, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #9fb3ac;
      transition: all var(--transition-fast);
    }

    .fav:hover {
      color: #ffffff;
      border-color: rgba(245, 158, 11, 0.45);
    }

    .fav.on {
      color: var(--accent-gold);
      border-color: rgba(245, 158, 11, 0.55);
    }

    .body {
      padding: 13px;
      cursor: pointer;
    }

    .lg {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-bright);
    }

    html[data-theme="light"] .lg {
      color: var(--accent-deep);
    }

    .title {
      font-size: 14.5px;
      font-weight: 700;
      margin: 4px 0;
    }

    .sub {
      font-size: 12px;
      color: var(--fg-tertiary);
    }

    /* Settings & Account Panel */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-card);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-secondary);
      margin-bottom: 6px;
    }

    .field-input,
    .field-select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
    }

    .field-input:focus,
    .field-select:focus {
      border-color: var(--accent);
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .switch-row:last-child {
      border-bottom: none;
    }

    .about-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(245, 158, 11, 0.08));
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 20px;
      margin-top: 12px;
    }

    .creator-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-gold-bright);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    html[data-theme="light"] .creator-pill {
      color: #92400e;
    }

    .feature-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
      margin-top: 14px;
      list-style: none;
    }

    .feature-list li {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 13px;
      font-size: 12.5px;
      color: var(--fg-secondary);
    }

    /* Modal & Frame Stage */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(3, 6, 5, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal.open {
      display: flex;
    }

    .box {
      width: 100%;
      max-width: 960px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      overflow: hidden;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .m-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
    }

    .m-scroll {
      overflow-y: auto;
    }

    .stage {
      aspect-ratio: 16 / 9;
      background: #000;
      width: 100%;
    }

    .stage iframe,
    .stage video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .m-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 11px 18px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }

    .m-yt {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .yt-in {
      flex: 1;
      min-width: 220px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 11px;
      font-size: 12px;
      outline: none;
    }

    .yt-in:focus {
      border-color: var(--accent);
    }

    .s-btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all var(--transition-fast);
    }

    .s-btn:hover {
      border-color: rgba(52, 211, 153, 0.35);
      color: var(--fg-primary);
    }

    .s-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-bright);
    }

    .ext {
      margin-left: auto;
      color: var(--accent-gold);
      border-color: rgba(245, 158, 11, 0.35);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 36px 18px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      color: var(--fg-tertiary);
    }

    @media (max-width: 780px) {
      .topbar {
        flex-wrap: wrap;
        padding: 8px 14px;
      }

      .nav-pills {
        order: 3;
        width: 100%;
      }

      .search-box {
        width: 160px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="#matches" class="arena-brand" id="brandHome" aria-label="Footime Pro Home">
      <svg class="arena-logo" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="proEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6ee7b7" />

            <stop offset="100%" stop-color="#047857" />
          </linearGradient>
          <linearGradient id="proGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fde68a" />
            <stop offset="55%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#b45309" />
          </linearGradient>
          <linearGradient id="proShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#132c23" />
            <stop offset="100%" stop-color="#070e0b" />
          </linearGradient>
        </defs>
        <g transform="translate(8, 10)">
          <path d="M38 4 L68 15 L64 49 C61 65 49 74 38 78 C27 74 15 65 12 49 L8 15 Z"
                fill="url(#proShieldBg)" stroke="url(#proEmerald)" stroke-width="2.4" />
          <path d="M38 11 L61 19.5 L57.8 47.5 C55.4 60 46.2 67.5 38 71 C29.8 67.5 20.6 60 18.2 47.5 L15 19.5 Z"

      return String(s ?? "")
        .replace(/&/g, "&amp;")

  <script>

      }
    ];

    ST.teamLeague = "all";
    ST.tnMatches = [];
    ST.replays = [];
    ST.teams = [];

    function toEmbedUrl(raw) {
      const u = (raw || "").trim();
      if (!u) return "";
      const m1 = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/);
      if (m1) return `https://www.youtube.com/embed/${m1[1]}?autoplay=${ST.prefs.autoplay ? 1 : 0}`;
      return u;
    }

    function matchQ(item) {
      const q = ST.q.trim().toLowerCase();
      if (!q) return true;
      const hay = `${item.title || ""} ${item.name || ""} ${item.league || ""} ${item.strLeague || ""} ${item.category || ""}`.toLowerCase();
      return [q, ...(ALIASES[q] || [])].some(t => hay.includes(t));
    }

    function statusOf(s, now = Date.now()) {
      if (s.always_live) return "live";
      const st = (s.starts_at || 0) * 1000;
      const en = (s.ends_at || 0) * 1000;
      if (!st) return "live";
      if (now < st) return "upcoming";
      if (en && now > en) return "ended";
      return "live";
    }

    function mapEventToMatch(ev, prefix = "ev", fallbackLeague = "Football") {
      const ts = ev.strTimestamp
        ? Math.floor(new Date(ev.strTimestamp).getTime() / 1000)
        : Math.floor((Date.now() - 86400000) / 1000);
      const hasScore = ev.intHomeScore != null && ev.intAwayScore != null;
      return {
        id: `${prefix}_${ev.idEvent}`,
        title: ev.strEvent || "Match",
        league: ev.strLeague || fallbackLeague,
        category: "Football",
        poster: ev.strThumb || "",
        starts_at: ts,
        ends_at: ts + 7200,
        score: hasScore ? `${ev.intHomeScore} - ${ev.intAwayScore}` : "FT",
        videoUrl: ev.strVideo || "",
        iframe: toEmbedUrl(ev.strVideo) || DEFAULT_EMBED_FRAME
      };
    }

    async function loadMatches(force = false) {
      if (!force && ST.matches.length) {
        render();
        return;
      }
      document.getElementById("app").innerHTML = `<div class="empty">Loading matches...</div>`;
      try {
        const data = await (await fetch(PPV_API)).json();
        const out = [];
        for (const cat of (data.streams || [])) {
          for (const s of (cat.streams || [])) {
            out.push({
              ...s,
              id: s.id || s.name,
              title: s.name || "Match",
              league: s.tag || cat.category || "Sports",
              category: cat.category || s.category_name || "Sports"
            });
          }
        }
        ST.matches = out;
        render();
      } catch {
        document.getElementById("app").innerHTML = `<div class="empty">Failed to load matches. <button class="btn-primary" onclick="loadMatches(true)">Retry</button></div>`;
      }
    }

    async function loadTunisia(force = false) {
      if (!force && ST.tnMatches.length) {
        render();
        return;
      }
      const teams = ["Esperance", "Club Africain", "Etoile du Sahel", "CS Sfaxien", "US Monastir"];
      const map = new Map();

      try {
        const leagueCalls = await Promise.all([
          fetch(`${SDB_API}/eventsnextleague.php?id=4445`).then(r => r.ok ? r.json() : {}).catch(() => ({})),
          fetch(`${SDB_API}/eventspastleague.php?id=4445`).then(r => r.ok ? r.json() : {}).catch(() => ({}))
        ]);
        for (const ev of [...(leagueCalls[0].events || []), ...(leagueCalls[1].events || [])]) {
          if (ev?.idEvent && !map.has(ev.idEvent)) {
            map.set(ev.idEvent, mapEventToMatch(ev, "tn", "Tunisian Ligue 1"));
          }
        }

        for (const t of teams) {
          try {
            const td = await (await fetch(`${SDB_API}/searchteams.php?t=${encodeURIComponent(t)}`)).json();
            const idTeam = td?.teams?.[0]?.idTeam;
            if (!idTeam) continue;
            const [nx, ls] = await Promise.all([
              fetch(`${SDB_API}/eventsnext.php?id=${idTeam}`).then(r => r.ok ? r.json() : {}).catch(() => ({})),
              fetch(`${SDB_API}/eventslast.php?id=${idTeam}`).then(r => r.ok ? r.json() : {}).catch(() => ({}))
            ]);
            for (const ev of [...(nx.events || []), ...(ls.results || [])]) {
              if (ev?.idEvent && !map.has(ev.idEvent)) {
                map.set(ev.idEvent, mapEventToMatch(ev, "tn", `${t} • Tunisia`));
              }
            }
          } catch {}
        }
      } catch {}

      ST.tnMatches = map.size ? [...map.values()] : FALLBACK_TUNISIA;
      render();
    }

    async function loadReplays(force = false) {
      if (!force && ST.replays.length) {
        render();
        return;
      }
      const map = new Map();
      const leagueIds = ["4445", "4328", "4335", "4332", "4331", "4334"];

      for (const id of leagueIds) {
        try {
          const d = await (await fetch(`${SDB_API}/eventspastleague.php?id=${id}`)).json();
          for (const ev of (d.events || [])) {
            if (ev?.idEvent && !map.has(ev.idEvent)) {
              map.set(ev.idEvent, mapEventToMatch(ev, "rep", ev.strLeague || "Match Replay"));
            }
          }
        } catch {}
      }

      const endedFromFeed = [...ST.matches, ...ST.tnMatches].filter(m => statusOf(m) === "ended" || m.videoUrl || m.score);
      for (const m of endedFromFeed) {
        const k = String(m.id ?? m.title);
        if (!map.has(k)) {
          map.set(k, {
            ...m,
            starts_at: m.starts_at || Math.floor((Date.now() - 86400000) / 1000),
            ends_at: m.ends_at || Math.floor((Date.now() - 79200000) / 1000),
            iframe: m.iframe || toEmbedUrl(m.videoUrl) || DEFAULT_EMBED_FRAME
          });
        }
      }

      ST.replays = map.size ? [...map.values()] : FALLBACK_REPLAYS;
      render();
    }

    async function loadTeams(force = false) {
      if (!force && ST.teams.length) {
        render();
        return;
      }
      document.getElementById("app").innerHTML = `<div class="empty">Loading world teams...</div>`;
      const leagues = [
        "English Premier League", "Spanish La Liga", "Italian Serie A",
        "German Bundesliga", "French Ligue 1", "Tunisian Ligue 1"
      ];
      const map = new Map();
      for (const lg of leagues) {
        try {
          const d = await (await fetch(`${SDB_API}/search_all_teams.php?l=${encodeURIComponent(lg)}`)).json();
          for (const tm of (d.teams || [])) {
            if (!tm.idTeam || map.has(tm.idTeam)) continue;
            map.set(tm.idTeam, {
              id: tm.idTeam,
              name: tm.strTeam,
              league: lg.includes("Tunisian") ? "tunisia" : lg,
              leagueLabel: tm.strLeague || lg,
              badge: tm.strBadge || "",
              country: tm.strCountry || ""
            });
          }
        } catch {}
      }
      ST.teams = [...map.values()];
      render();
    }

    async function searchAnyTeam(query) {
      const q = (query || "").trim();
      if (!q) return;
      try {
        const d = await (await fetch(`${SDB_API}/searchteams.php?t=${encodeURIComponent(q)}`)).json();
        const found = (d.teams || []).filter(tm => tm.idTeam && (tm.strSport || "Soccer").toLowerCase().includes("soccer"));
        const map = new Map(ST.teams.map(t => [t.id, t]));
        for (const tm of found) {
          if (!map.has(tm.idTeam)) {
            map.set(tm.idTeam, {
              id: tm.idTeam,
              name: tm.strTeam,
              league: (tm.strLeague || "").toLowerCase().includes("tunisia") ? "tunisia" : (tm.strLeague || "all"),
              leagueLabel: tm.strLeague || "World Team",
              badge: tm.strBadge || "",
              country: tm.strCountry || ""
            });
          }
        }
        ST.teams = [...map.values()];
        render();
      } catch {}
    }

    async function openTeamDetails(tm) {
      const body = document.getElementById("mBody");
      const bar = document.getElementById("mBar");
      const ytRow = document.getElementById("mYt");
      bar.style.display = "none";
      ytRow.style.display = "flex";
      document.getElementById("mTitle").textContent = `${tm.name} (${tm.leagueLabel})`;
      document.getElementById("ytUrlInput").value = "";
      document.getElementById("ytPlayBtn").onclick = () => {
        const emb = toEmbedUrl(document.getElementById("ytUrlInput").value);
        if (emb) {
          body.innerHTML = `<div class="stage"><iframe src="${esc(emb)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>`;
        }
      };

      destroyHls();
      document.getElementById("modal").classList.add("open");
      body.innerHTML = `<div class="stage"><iframe src="${esc(DEFAULT_EMBED_FRAME)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div><div style="padding:18px;"><div class="empty">Loading ${esc(tm.name)} fixtures &amp; replays...</div></div>`;

      const liveMatches = ST.matches.filter(m => (m.title || "").toLowerCase().includes(tm.name.toLowerCase()));
      const [nx, ls] = await Promise.all([
        fetch(`${SDB_API}/eventsnext.php?id=${tm.id}`).then(r => r.ok ? r.json() : {}).catch(() => ({})),
        fetch(`${SDB_API}/eventslast.php?id=${tm.id}`).then(r => r.ok ? r.json() : {}).catch(() => ({}))
      ]);
      const upcoming = nx.events || [];
      const past = ls.results || [];

      const renderEvRow = (ev, isPast) => {
        const title = ev.strEvent || "Match";
        const score = (ev.intHomeScore != null && ev.intAwayScore != null) ? ` (${ev.intHomeScore}-${ev.intAwayScore})` : "";
        const itemObj = {
          id: "ev_" + ev.idEvent,
          title: title + score,
          league: ev.strLeague || tm.leagueLabel,
          iframe: toEmbedUrl(ev.strVideo) || DEFAULT_EMBED_FRAME
        };
        const enc = encodeURIComponent(JSON.stringify(itemObj));
        return `<div class="t-row">
          <div>
            <strong>${esc(title)}${esc(score)}</strong>
            <div class="sub">${esc(ev.dateEvent || "")} • ${esc(ev.strLeague || tm.leagueLabel)}</div>
          </div>
          <button class="s-btn active" onclick='openMatch(JSON.parse(decodeURIComponent("${enc}")))'>${isPast ? "Play Replay ▶" : "Play in Frame ▶"}</button>
        </div>`;
      };

      body.innerHTML = `<div class="stage"><iframe src="${esc(DEFAULT_EMBED_FRAME)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>
      <div style="padding:18px;">
        <h3 style="margin-bottom:10px;">Live Stream Matches (${liveMatches.length})</h3>
        ${liveMatches.length
          ? liveMatches.map(m => `<div class="t-row"><div><strong>${esc(m.title)}</strong><div class="sub">${esc(m.league)}</div></div><button class="s-btn active" onclick='openMatch(${JSON.stringify(m).replace(/'/g, "&#39;")})'>Watch Live ▶</button></div>`).join("")
          : `<div class="sub" style="margin-bottom:14px;">No active stream in live feed for ${esc(tm.name)} right now.</div>`}

        <h3 style="margin:14px 0 10px;">Upcoming (${upcoming.length})</h3>
        ${upcoming.length ? upcoming.slice(0, 8).map(e => renderEvRow(e, false)).join("") : `<div class="sub" style="margin-bottom:14px;">No upcoming fixtures listed.</div>`}

        <h3 style="margin:14px 0 10px;">Recent Matches / Replays (${past.length})</h3>
        ${past.length ? past.slice(0, 8).map(e => renderEvRow(e, true)).join("") : `<div class="sub">No recent matches listed.</div>`}
      </div>`;
    }
  </script>
  <script>
    function saveFavs() {
      localStorage.setItem("footime_favs", JSON.stringify(ST.favs));
      const el = document.getElementById("favCount");
      if (el) el.textContent = ST.favs.matches.length + ST.favs.channels.length;
    }

    function toggleFav(type, obj) {
      const list = ST.favs[type];
      const key = String(obj.id ?? obj.title);
      const i = list.findIndex(x => String(x.id ?? x.title) === key);
      if (i > -1) list.splice(i, 1);
      else list.push(obj);
      saveFavs();
      render();
    }

    function moveInd() {
      const b = document.querySelector("#navPills .nav-btn.active");
      const ind = document.getElementById("navInd");
      if (b && ind) {
        ind.style.left = b.offsetLeft + "px";
        ind.style.width = b.offsetWidth + "px";
      }
    }

    async function loadChannels(force = false) {
      if (!force && ST.channels.length) {
        render();
        return;
      }
      document.getElementById("app").innerHTML = `<div class="empty">Loading channels...</div>`;
      try {
        const [chs, sts, lgs] = await Promise.all([
          fetch(`${IPTV_API}/channels.json`).then(r => r.json()),
          fetch(`${IPTV_API}/streams.json`).then(r => r.json()),
          fetch(`${IPTV_API}/logos.json`).then(r => r.ok ? r.json() : []).catch(() => [])
        ]);
        const logoMap = new Map();
        for (const l of lgs) {
          if (l.channel && l.url && !logoMap.has(l.channel)) logoMap.set(l.channel, l.url);
        }
        const stMap = new Map();
        for (const s of sts) {
          if (!s.channel || !s.url || (s.status && s.status !== "online")) continue;
          if (!stMap.has(s.channel)) stMap.set(s.channel, []);
          stMap.get(s.channel).push(s.url);
        }
        ST.channels = chs
          .filter(c => c.id && stMap.has(c.id))
          .map(c => ({
            id: c.id,
            name: c.name || c.id,
            logo: logoMap.get(c.id) || "",
            streams: stMap.get(c.id),
            country: (c.country || "").toUpperCase(),
            category: Array.isArray(c.categories) ? (c.categories[0] || "general") : (c.category || "general")
          }));
        render();
      } catch {
        document.getElementById("app").innerHTML = `<div class="empty">Failed to load channels. <button class="btn-primary" onclick="loadChannels(true)">Retry</button></div>`;
      }
    }

    function destroyHls() {
      if (ST.hls) {
        ST.hls.destroy();
        ST.hls = null;
      }
    }

    function closeModal() {
      destroyHls();
      document.getElementById("modal").classList.remove("open");
      document.getElementById("mBody").innerHTML = "";
      document.getElementById("mBar").style.display = "none";
      document.getElementById("mYt").style.display = "none";
    }

    function openMatch(m) {
      const sources = [];
      if (m.iframe) {
        sources.push({
          label: `${(m.locale || "EN").toUpperCase()} • ${m.source_tag || "Main Frame"}`,
          url: toEmbedUrl(m.iframe)
        });
      }
      (m.substreams || []).forEach((sub, i) => {
        if (sub.iframe) {
          sources.push({
            label: `${(sub.locale || m.locale || "EN").toUpperCase()} • ${sub.source_tag || sub.name || "Backup " + (i + 1)}`,
            url: toEmbedUrl(sub.iframe)
          });
        }
      });
      if (m.videoUrl) {
        sources.push({ label: "Video Frame", url: toEmbedUrl(m.videoUrl) });
      }
      if (!sources.length) {
        sources.push({ label: "Frame Player", url: DEFAULT_EMBED_FRAME });
      }

      const body = document.getElementById("mBody");
      const bar = document.getElementById("mBar");
      const ytRow = document.getElementById("mYt");
      document.getElementById("mTitle").textContent = m.title + (m.score ? ` (${m.score})` : "");
      destroyHls();
      document.getElementById("modal").classList.add("open");

      ytRow.style.display = "flex";
      const ytInput = document.getElementById("ytUrlInput");
      ytInput.value = "";
      document.getElementById("ytPlayBtn").onclick = () => {
        const emb = toEmbedUrl(ytInput.value);
        if (!emb) return;
        body.innerHTML = `<div class="stage"><iframe src="${esc(emb)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>`;
      };

      const playIdx = (i) => {
        const s = sources[i];
        body.innerHTML = `<div class="stage"><iframe src="${esc(s.url)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>`;
        bar.style.display = "flex";
        bar.innerHTML = sources
          .map((x, idx) => `<button class="s-btn ${idx === i ? "active" : ""}" data-i="${idx}">${esc(x.label)}</button>`)
          .join("") + `<a class="s-btn ext" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Open in Tab ↗</a>`;
        bar.querySelectorAll("[data-i]").forEach(btn => {
          btn.onclick = () => playIdx(+btn.dataset.i);
        });
      };
      playIdx(0);
    }

    function openChannel(ch) {
      const list = (ch.streams || [ch.url]).filter(Boolean);
      if (!list.length) list.push(DEFAULT_EMBED_FRAME);
      const body = document.getElementById("mBody");
      const bar = document.getElementById("mBar");
      document.getElementById("mYt").style.display = "flex";
      document.getElementById("mTitle").textContent = ch.name;
      destroyHls();
      document.getElementById("modal").classList.add("open");

      const ytInput = document.getElementById("ytUrlInput");
      ytInput.value = "";
      document.getElementById("ytPlayBtn").onclick = () => {
        const emb = toEmbedUrl(ytInput.value);
        if (!emb) return;
        destroyHls();
        body.innerHTML = `<div class="stage"><iframe src="${esc(emb)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>`;
      };

      let idx = 0;
      const run = () => {
        const url = list[idx];
        destroyHls();
        bar.style.display = "flex";
        bar.innerHTML = `<span style="font-size:12px;color:var(--fg-tertiary);">Source ${idx + 1}/${list.length}</span>`
          + (list.length > 1 ? `<button class="s-btn active" id="nxSrc">Next Source ↻</button>` : "")
          + `<a class="s-btn ext" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open in Tab ↗</a>`;
        document.getElementById("nxSrc")?.addEventListener("click", () => {
          idx = (idx + 1) % list.length;
          run();
        });

        if (/\.m3u8(\?|$)/i.test(url) && window.Hls && Hls.isSupported()) {
          body.innerHTML = `<div class="stage"><video id="vid" controls autoplay playsinline></video></div>`;
          const v = document.getElementById("vid");
          const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
          ST.hls = hls;
          hls.loadSource(url);
          hls.attachMedia(v);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (ST.prefs.autoplay) v.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, (_, d) => {
            if (d.fatal) {
              if (idx < list.length - 1) {
                idx++;
                run();
              } else {
                body.innerHTML = `<div class="stage"><iframe src="${esc(DEFAULT_EMBED_FRAME)}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>`;
              }
            }
          });
        } else {
          body.innerHTML = `<div class="stage"><iframe src="${esc(toEmbedUrl(url))}" allowfullscreen webkitallowfullscreen allow="autoplay; fullscreen *"></iframe></div>`;
        }
      };
      run();
    }

    function matchCard(m, st) {
      const isFav = ST.favs.matches.some(x => String(x.id ?? x.title) === String(m.id ?? m.title));
      const dt = m.starts_at
        ? new Date(m.starts_at * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
        : "TBD";
      const enc = encodeURIComponent(JSON.stringify(m));
      const pill = st === "live"
        ? '<span class="live-dot"></span> LIVE'
        : st === "ended"
          ? (m.score ? `FT • ${esc(m.score)}` : "FINISHED")
          : esc(dt);
      return `<div class="card">
        <div class="banner" onclick="openMatch(JSON.parse(decodeURIComponent('${enc}')))">
          ${m.poster ? `<img src="${esc(m.poster)}" loading="lazy" onerror="this.style.display='none'">` : ""}
          <div class="scrim"></div>
          <div class="pill">${pill}</div>
          <button class="fav ${isFav ? "on" : ""}" onclick="event.stopPropagation();toggleFav('matches',JSON.parse(decodeURIComponent('${enc}')))">★</button>
        </div>
        <div class="body" onclick="openMatch(JSON.parse(decodeURIComponent('${enc}')))">
          <div class="lg">${esc(m.league || m.category)}</div>
          <div class="title">${esc(m.title)}</div>
          <div class="sub">${st === "live" ? "Live stream" : st === "ended" ? "Replay / Highlights" : "Starts " + esc(dt)}</div>
        </div>
      </div>`;
    }

    function render() {
      const app = document.getElementById("app");
      const now = Date.now();

      if (ST.tab === "settings") {
        renderSettingsView(app);
        return;
      }

      if (ST.tab === "matches") {
        const isTn = ST.sport === "tunisia";
        const base = isTn
          ? ST.tnMatches
          : ST.matches.filter(m => ST.sport === "all" || (m.category || "").toLowerCase() === ST.sport.toLowerCase());
        const list = base.filter(matchQ);
        const live = list.filter(m => statusOf(m, now) === "live");
        const up = list.filter(m => statusOf(m, now) === "upcoming");
        const past = list.filter(m => statusOf(m, now) === "ended");
        const feat = live[0] || up[0] || list[0];
        const fEnc = feat ? encodeURIComponent(JSON.stringify(feat)) : "";
        app.innerHTML = `
          ${feat ? `<section class="hero-card">
            ${feat.poster ? `<div class="hero-glow" style="background-image:url('${esc(feat.poster)}')"></div>` : ""}
            <div class="hero-content">
              <span class="badge ${statusOf(feat, now) === "live" ? "badge-live" : "badge-up"}">${statusOf(feat, now) === "live" ? "LIVE NOW" : "FEATURED"}</span>
              <span class="badge badge-lg">${esc(feat.league || feat.category)}</span>
              <h1 class="hero-title">${esc(feat.title)}</h1>
              <p class="hero-sub">Footime Pro — Created by Youssef • Live football, Tunisian Ligue 1, world teams, replays &amp; channels.</p>
              <a href="javascript:void(0)" class="btn-primary" onclick="openMatch(JSON.parse(decodeURIComponent('${fEnc}')))">▶ Open Match</a>
            </div>
          </section>` : ""}
          <div class="filter-bar">${SPORTS.map(s => `<button class="chip ${s.tn ? "tn" : ""} ${ST.sport === s.id ? "active" : ""}" data-sp="${esc(s.id)}">${esc(s.label)}</button>`).join("")}</div>
          ${ST.q ? `<div class="note"><span>Search: <strong>${esc(ST.q)}</strong></span><button class="s-btn" id="clrQ">Clear</button></div>` : ""}
          <h2 class="section-title"><span class="bar"></span> Live Now (${live.length})</h2>
          <div class="grid">${live.length ? live.map(m => matchCard(m, "live")).join("") : `<div class="empty">No live matches right now.</div>`}</div>
          <h2 class="section-title"><span class="bar"></span> Upcoming (${up.length})</h2>
          <div class="grid">${up.length ? up.slice(0, 24).map(m => matchCard(m, "upcoming")).join("") : `<div class="empty">No upcoming matches right now.</div>`}</div>
          ${isTn ? `<h2 class="section-title"><span class="bar"></span> Recent Results (${past.length})</h2>
          <div class="grid">${past.length ? past.slice(0, 24).map(m => matchCard(m, "ended")).join("") : `<div class="empty">No recent results returned.</div>`}</div>` : ""}
        `;
        app.querySelectorAll("[data-sp]").forEach(b => {
          b.onclick = () => {
            ST.sport = b.dataset.sp;
            if (ST.sport === "tunisia") loadTunisia();
            render();
          };
        });
        document.getElementById("clrQ")?.addEventListener("click", () => {
          ST.q = "";
          document.getElementById("searchInput").value = "";
          render();
        });

      } else if (ST.tab === "teams") {
        const list = ST.teams.filter(t => (ST.teamLeague === "all" || t.league === ST.teamLeague) && matchQ(t));
        app.innerHTML = `<h2 class="section-title"><span class="bar"></span> World Teams (${list.length})</h2>
          <div class="filter-bar">${WORLD_LEAGUES.map(l => `<button class="chip ${l.tn ? "tn" : ""} ${ST.teamLeague === l.id ? "active" : ""}" data-tlg="${esc(l.id)}">${esc(l.label)}</button>`).join("")}</div>
          <div class="grid">${list.length ? list.map(tm => {
            const enc = encodeURIComponent(JSON.stringify(tm));
            return `<div class="team-card" onclick="openTeamDetails(JSON.parse(decodeURIComponent('${enc}')))">
              <div class="team-badge">${tm.badge ? `<img src="${esc(tm.badge)}" loading="lazy" onerror="this.remove()">` : esc(tm.name.slice(0, 3).toUpperCase())}</div>
              <div style="flex:1;min-width:0;"><div class="title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(tm.name)}</div><div class="sub">${esc(tm.leagueLabel)} ${tm.country ? "• " + esc(tm.country) : ""}</div></div>
            </div>`;
          }).join("") : `<div class="empty">No teams found. Type any team name in search and press Enter.</div>`}</div>`;
        app.querySelectorAll("[data-tlg]").forEach(b => {
          b.onclick = () => {
            ST.teamLeague = b.dataset.tlg;
            render();
          };
        });

      } else if (ST.tab === "replays") {
        const list = (ST.replays.length ? ST.replays : FALLBACK_REPLAYS).filter(matchQ);
        app.innerHTML = `<h2 class="section-title"><span class="bar"></span> Replays &amp; Highlights (${list.length})</h2>
          <div class="grid">${list.length ? list.slice(0, 30).map(m => matchCard(m, "ended")).join("") : `<div class="empty">No replays or highlights available yet.</div>`}</div>`;

      } else if (ST.tab === "channels") {
        const q = ST.q.trim().toLowerCase();
        const countries = [...new Set(ST.channels.map(c => c.country).filter(Boolean))].sort();
        const cats = [...new Set(ST.channels.map(c => c.category).filter(Boolean))].sort();
        const chs = ST.channels
          .filter(c => (ST.country === "all" || c.country === ST.country) && (ST.cat === "all" || c.category === ST.cat) && (!q || (c.name || "").toLowerCase().includes(q)))
          .slice(0, 90);
        app.innerHTML = `<h2 class="section-title"><span class="bar"></span> Live Channels</h2>
          <div class="tv-bar">
            <select class="select" id="selC"><option value="all">All Countries</option>${countries.map(c => `<option value="${esc(c)}" ${ST.country === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
            <select class="select" id="selK"><option value="all">All Categories</option>${cats.map(c => `<option value="${esc(c)}" ${ST.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
            <button class="chip ${ST.cat === "sports" ? "active" : ""}" id="qSp">⚽ Sports</button>
            <button class="chip tn ${ST.country === "TN" ? "active" : ""}" id="qTn">🇹🇳 Tunisia</button>
          </div>
          <div class="grid">${chs.length ? chs.map(ch => {
            const isFav = ST.favs.channels.some(x => String(x.id) === String(ch.id));
            const enc = encodeURIComponent(JSON.stringify(ch));
            return `<div class="ch-card" onclick="openChannel(JSON.parse(decodeURIComponent('${enc}')))">
              <div class="ch-logo">${ch.logo ? `<img src="${esc(ch.logo)}" loading="lazy" onerror="this.remove()">` : "TV"}</div>
              <div style="flex:1;min-width:0;"><div class="title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(ch.name)}</div><div class="sub">${esc(ch.country || "INTL")} • ${esc(ch.category)}</div></div>
              <button class="fav ${isFav ? "on" : ""}" style="position:static;" onclick="event.stopPropagation();toggleFav('channels',JSON.parse(decodeURIComponent('${enc}')))">★</button>
            </div>`;
          }).join("") : `<div class="empty">No channels found.</div>`}</div>`;
        document.getElementById("selC").onchange = e => { ST.country = e.target.value; render(); };
        document.getElementById("selK").onchange = e => { ST.cat = e.target.value; render(); };
        document.getElementById("qSp").onclick = () => { ST.cat = ST.cat === "sports" ? "all" : "sports"; render(); };
        document.getElementById("qTn").onclick = () => { ST.country = ST.country === "TN" ? "all" : "TN"; render(); };

      } else {
        app.innerHTML = `<h2 class="section-title"><span class="bar"></span> Favorite Matches (${ST.favs.matches.length})</h2>
          <div class="grid">${ST.favs.matches.length ? ST.favs.matches.map(m => matchCard(m, statusOf(m, now))).join("") : `<div class="empty">No favorite matches yet.</div>`}</div>
          <h2 class="section-title"><span class="bar"></span> Favorite Channels (${ST.favs.channels.length})</h2>
          <div class="grid">${ST.favs.channels.length ? ST.favs.channels.map(ch => {
            const enc = encodeURIComponent(JSON.stringify(ch));
            return `<div class="ch-card" onclick="openChannel(JSON.parse(decodeURIComponent('${enc}')))">
              <div class="ch-logo">${ch.logo ? `<img src="${esc(ch.logo)}">` : "TV"}</div>
              <div style="flex:1;"><div class="title">${esc(ch.name)}</div><div class="sub">${esc(ch.country || "INTL")} • ${esc(ch.category)}</div></div>
              <button class="fav on" style="position:static;" onclick="event.stopPropagation();toggleFav('channels',JSON.parse(decodeURIComponent('${enc}')))">★</button>
            </div>`;
          }).join("") : `<div class="empty">No favorite channels yet.</div>`}</div>`;
      }
    }

    document.querySelectorAll("#navPills .nav-btn").forEach(b => {
      b.onclick = () => {
        ST.tab = b.dataset.tab;
        document.querySelectorAll("#navPills .nav-btn").forEach(x => x.classList.toggle("active", x === b));
        moveInd();
        render();
        if (ST.tab === "teams" && !ST.teams.length) loadTeams();
        if (ST.tab === "replays" && !ST.replays.length) loadReplays();
        if (ST.tab === "channels" && !ST.channels.length) loadChannels();
        if (ST.sport === "tunisia" && !ST.tnMatches.length) loadTunisia();
      };
    });

    document.getElementById("brandHome").onclick = e => {
      e.preventDefault();
      document.querySelector('[data-tab="matches"]').click();
    };
    document.getElementById("searchInput").oninput = e => {
      ST.q = e.target.value;
      render();
    };
    document.getElementById("searchInput").onkeydown = e => {
      if (e.key === "Enter" && ST.tab === "teams") searchAnyTeam(ST.q);
    };
    document.getElementById("refreshBtn").onclick = () => {
      if (ST.tab === "channels") loadChannels(true);
      else if (ST.tab === "teams") loadTeams(true);
      else if (ST.tab === "replays") loadReplays(true);
      else {
        loadMatches(true);
        if (ST.sport === "tunisia") loadTunisia(true);
      }
    };
    document.getElementById("mClose").onclick = closeModal;
    document.getElementById("modal").onclick = e => {
      if (e.target.id === "modal") closeModal();
    };
    window.onresize = moveInd;

    saveFavs();
    moveInd();
    loadMatches();
  </script>
  <style>

      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stat-tile strong {
      font-family: "Outfit", sans-serif;
      font-size: 19px;
      color: var(--accent-bright);
    }

    html[data-theme="light"] .stat-tile strong {
      color: var(--accent-deep);
    }

    .stat-tile span {
      font-size: 12px;
      color: var(--fg-tertiary);
      font-weight: 600;

      max-height: 76vh;

    .toast-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 200;

          if (parsed.prefs && typeof parsed.prefs === "object") {
            ST.prefs = Object.assign({}, DEFAULT_PREFS, parsed.prefs);
            ST.prefs.account = Object.assign({}, DEFAULT_PREFS.account, parsed.prefs.account || {});

          if (parsed.favs && typeof parsed.favs === "object") {
            ST.favs = {
              matches: Array.isArray(parsed.favs.matches) ? parsed.favs.matches : [],
              channels: Array.isArray(parsed.favs.channels) ? parsed.favs.channels : []
            };

          if (Array.isArray(parsed.history)) {
            ST.history = parsed.history.slice(0, 12);
            localStorage.setItem("footime_history", JSON.stringify(ST.history));

          saveFavs();
          showToast("✓ Backup JSON restauré avec succès");

  <script>
    ST.prefs.autoRefresh = Boolean(ST.prefs.autoRefresh);

    function formatTimeRemaining(startsAtSec) {
      const diffMs = (startsAtSec * 1000) - Date.now();
      if (diffMs <= 0) return "";
      const mins = Math.floor(diffMs / 60000);
      if (mins < 60) return `in ${mins}m`;
      const hrs = Math.floor(mins / 60);
      const remM = mins % 60;
      if (hrs < 24) return `in ${hrs}h ${remM}m`;
      const days = Math.floor(hrs / 24);
      return `in ${days}d ${hrs % 24}h`;
    }

    function copyCurrentFrameUrl() {
      const iframe = document.querySelector("#mBody iframe");
      const video = document.querySelector("#mBody video");
      const targetUrl = iframe?.getAttribute("src") || video?.currentSrc || "";
      if (!targetUrl) {
        showToast("✕ Aucun lien actif à copier");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(targetUrl)
          .then(() => showToast("✓ Lien du lecteur copié"))
          .catch(() => showToast("✕ Impossible de copier le lien"));
      } else {
        const tmp = document.createElement("input");
        tmp.value = targetUrl;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        tmp.remove();
        showToast("✓ Lien du lecteur copié");
      }

      const secs = totalSec % 60;

  <script>

      "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1400&q=80",

      "https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?auto=format&fit=crop&w=1400&q=80",

      "https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1489944440615-453fc2b6a9a9?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1551958219-acbc608c6377?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1560272564-c83b66b1ad12?auto=format&fit=crop&w=1400&q=80",

    ];

    ST.teamVisualCache = JSON.parse(localStorage.getItem("footime_team_art_cache") || "{}");
    ST._fetchingTeams = ST._fetchingTeams || new Set();

    function hashStringToIndex(str, len) {
      const s = String(str || "world");
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h) % Math.max(1, len);
    }

    function findCachedTeamRecord(teamName) {
      const target = String(teamName || "").trim().toLowerCase();
      if (!target) return null;

      if (Array.isArray(ST.teams) && ST.teams.length) {
        const exact = ST.teams.find(t => (t.name || "").toLowerCase() === target);
        if (exact) return exact;
        const partial = ST.teams.find(t =>
          (t.name || "").toLowerCase().includes(target) || target.includes((t.name || "").toLowerCase())
        );
        if (partial) return partial;
      }

      if (ST.teamVisualCache[target]) {
        return ST.teamVisualCache[target];
      }
      return null;
    }

    function resolveWorldTeamVisual(teamName, matchObj) {
      const cleanName = String(teamName || "").trim();
      const cached = findCachedTeamRecord(cleanName);
      const artIdx = hashStringToIndex(cleanName || matchObj?.title || "team", WORLD_SPORTS_ART_POOL.length);
      const fallbackPhoto = matchObj?.poster || cached?.banner || cached?.fanart || WORLD_SPORTS_ART_POOL[artIdx];

      return {
        teamName: cleanName || "World Club",
        photo: fallbackPhoto,
        badge: cached?.badge || DEFAULT_LOBBY_ART.crest,
        league: cached?.leagueLabel || matchObj?.league || "World Football"
      };
    }

    async function fetchLiveTeamVisualFromApi(teamName) {
      const clean = String(teamName || "").trim();
      if (!clean || clean.length < 2) return null;
      const key = clean.toLowerCase();
      if (ST.teamVisualCache[key]?.fetched) return ST.teamVisualCache[key];
      if (ST._fetchingTeams.has(key)) return null;

      ST._fetchingTeams.add(key);
      try {
        const res = await fetch(`${SDB_API}/searchteams.php?t=${encodeURIComponent(clean)}`);
        if (!res.ok) return null;
        const data = await res.json();
        const tm = (data?.teams || []).find(item =>
          (item.strSport || "Soccer").toLowerCase().includes("soccer")
        ) || data?.teams?.[0];

        if (tm) {
          const bestPhoto = tm.strBanner || tm.strFanart1 || tm.strThumb || "";
          const entry = {
            name: tm.strTeam || clean,
            badge: tm.strBadge || "",
            banner: bestPhoto,
            fanart: tm.strFanart1 || "",
            leagueLabel: tm.strLeague || "World Football",
            fetched: true
          };
          ST.teamVisualCache[key] = entry;
          try {
            localStorage.setItem("footime_team_art_cache", JSON.stringify(ST.teamVisualCache));
          } catch {}
          return entry;
        }
      } catch {} finally {
        ST._fetchingTeams.delete(key);
      }
      return null;
    }

    function enrichLobbyWithAnyWorldTeam() {
      const wrapper = document.getElementById("exclusiveLobbyWrapper");
      if (!wrapper) return;

      const list = typeof getExclusiveLobbyCandidates === "function" ? getExclusiveLobbyCandidates() : [];
      if (!list.length) return;
      const idx = Math.min(Number(ST.lobbyIndex || 0), list.length - 1);
      const current = list[idx];
      if (!current) return;

      const [homeTeam, awayTeam] = parseMatchTeamsPair(current.title);
      const homeVis = resolveWorldTeamVisual(homeTeam, current);
      const awayVis = resolveWorldTeamVisual(awayTeam, current);

      const photoEl = wrapper.querySelector(".lobby-player-photo");
      if (photoEl && homeVis.photo) {
        photoEl.src = homeVis.photo;
      }

      const crestEls = wrapper.querySelectorAll(".lobby-team-crest");
      if (crestEls[0] && homeVis.badge) crestEls[0].src = homeVis.badge;
      if (crestEls[1] && awayVis.badge) crestEls[1].src = awayVis.badge;

      const sideTag = wrapper.querySelector(".lobby-side-tag strong");
      if (sideTag) {
        sideTag.textContent = `${homeVis.teamName.toUpperCase()} • WORLD MATCH`;
      }

      const infoStack = wrapper.querySelector(".lobby-info-stack");
      if (infoStack && !wrapper.querySelector(".world-team-tag-pill")) {
        const pill = document.createElement("div");
        pill.className = "world-team-tag-pill";
        pill.textContent = `🌍 ${homeVis.teamName} vs ${awayVis.teamName}`;
        infoStack.prepend(pill);
      }

      Promise.all([
        fetchLiveTeamVisualFromApi(homeTeam),
        fetchLiveTeamVisualFromApi(awayTeam)
      ]).then(([hApi, aApi]) => {
        const activeList = typeof getExclusiveLobbyCandidates === "function" ? getExclusiveLobbyCandidates() : [];
        if (activeList[ST.lobbyIndex]?.id !== current.id) return;
        const nextPhoto = hApi?.banner || hApi?.fanart || aApi?.banner || "";
        if (nextPhoto && photoEl) {
          photoEl.src = nextPhoto;
        }
        if (hApi?.badge && crestEls[0]) crestEls[0].src = hApi.badge;
        if (aApi?.badge && crestEls[1]) crestEls[1].src = aApi.badge;
      });
    }

    const _p16Render = render;
    render = function () {
      _p16Render();
      enrichLobbyWithAnyWorldTeam();
    };
  </script>

    function scoreStreamCandidate(srcObj) {
      if (!srcObj || !srcObj.url) return -1;
      const u = String(srcObj.url).toLowerCase();
      const lbl = String(srcObj.label || "").toLowerCase();
      let score = 10;
      if (u.includes(".m3u8")) score += 25;
      if (lbl.includes("1080") || lbl.includes("hd")) score += 20;
      if (lbl.includes("main") || lbl.includes("primary")) score += 12;
      if (lbl.includes("en") || lbl.includes("fr") || lbl.includes("ar")) score += 8;
      if (u.includes("embed") || u.includes("player") || u.includes("stream")) score += 10;
      return score;
    }

    function rankSourcesByQuality(rawSources) {
      if (!Array.isArray(rawSources) || !rawSources.length) return [];
      const seen = new Set();
      const cleaned = [];
      for (const s of rawSources) {
        if (!s || !s.url) continue;
        const normUrl = String(s.url).trim();
        if (!normUrl || seen.has(normUrl)) continue;
        seen.add(normUrl);
        cleaned.push({
          label: s.label || "Stream Source",
          url: normUrl,
          _qScore: scoreStreamCandidate(s)
        });
      }
      return cleaned.sort((a, b) => b._qScore - a._qScore);
    }

  <script>
    ST.emailAuth = Object.assign({
      email: ST.prefs?.account?.email || "",
      verified: false,
      pendingCode: "",
      expiresAt: 0,
      lastSentTo: ""
    }, JSON.parse(localStorage.getItem("footime_email_auth") || "{}"));

    function persistEmailAuthState() {
      try {
        localStorage.setItem("footime_email_auth", JSON.stringify({
          email: ST.emailAuth.email,
          verified: Boolean(ST.emailAuth.verified),
          lastSentTo: ST.emailAuth.lastSentTo || ""
        }));
      } catch {}
    }

    function generateSixDigitOtp() {
      const n = Math.floor(100000 + Math.random() * 900000);
      return String(n);
    }

    async function dispatchVerificationEmail(targetEmail, codeStr) {
      const cfg = ST.emailGateway || {};
      if (cfg.serviceId && cfg.templateId && cfg.publicKey) {
        try {
          const resp = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              service_id: cfg.serviceId,
              template_id: cfg.templateId,
              user_id: cfg.publicKey,
              template_params: {
                to_email: targetEmail,
                user_name: ST.prefs?.account?.name || "Youssef",
                verification_code: codeStr,
                app_name: "Footime Pro"
              }
            })
          });
          if (resp.ok) {
            return { sentExternal: true, note: `Code envoyé vers ${targetEmail}` };
          }
        } catch {}
      }
      return {
        sentExternal: false,
        note: `Mode test local : code généré pour ${targetEmail} (configure EmailJS en Partie 23 pour envoi SMTP direct)`
      };
    }

    async function handleSendVerificationCode() {
      const emailInp = document.getElementById("verifyTargetEmailInput") || document.getElementById("accEmail");
      const rawEmail = (emailInp?.value || ST.emailAuth.email || "").trim();
      if (!rawEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(rawEmail)) {
        showToast("✕ Entre une adresse email valide");
        return;
      }

      const code = generateSixDigitOtp();
      ST.emailAuth.email = rawEmail;
      ST.emailAuth.pendingCode = code;
      ST.emailAuth.expiresAt = Date.now() + 10 * 60 * 1000;
      ST.emailAuth.lastSentTo = rawEmail;

      if (ST.prefs?.account) {
        ST.prefs.account.email = rawEmail;
        applyThemeAndLang();
      }
      persistEmailAuthState();

      const res = await dispatchVerificationEmail(rawEmail, code);
      showToast(res.sentExternal ? `✓ Code envoyé à ${rawEmail}` : `✓ Code de test généré : ${code}`);

      const box = document.getElementById("otpTestPreviewBox");
      if (box) {
        box.style.display = "block";
        box.innerHTML = `${esc(res.note)}<br>Code de vérification (valide 10 min) : <strong>${esc(code)}</strong>`;
      }
    }

    function handleVerifySubmittedCode() {
      const codeInp = document.getElementById("verifyCodeInput");
      const entered = (codeInp?.value || "").trim();
      if (!entered) {
        showToast("✕ Saisis le code à 6 chiffres");
        return;
      }
      if (!ST.emailAuth.pendingCode || Date.now() > (ST.emailAuth.expiresAt || 0)) {
        showToast("✕ Code expiré, clique sur Envoyer le code");
        return;
      }
      if (entered !== ST.emailAuth.pendingCode) {
        showToast("✕ Code incorrect, vérifie bien les 6 chiffres");
        return;
      }

      ST.emailAuth.verified = true;
      ST.emailAuth.pendingCode = "";
      persistEmailAuthState();
      showToast("✓ Email vérifié avec succès !");
      render();
    }

    function injectEmailVerificationCard(app) {
      if (!app || document.getElementById("emailVerificationCard")) return;
      const isVer = Boolean(ST.emailAuth.verified);
      const currentEmail = ST.emailAuth.email || ST.prefs?.account?.email || "";

        <div class="sub">
          Reçois un code à 6 chiffres pour vérifier l'adresse email associée au compte <strong>${esc(ST.prefs?.account?.name || "Youssef")}</strong>.
        </div>
        <div class="verify-inline-row">
          <input type="email" id="verifyTargetEmailInput" class="field-input" style="flex:1;min-width:220px;" placeholder="exemple@domaine.com" value="${esc(currentEmail)}" />
          <button type="button" class="s-btn active" id="sendEmailCodeBtn">📨 Envoyer le code</button>
        </div>
        <div class="verify-inline-row">
          <input type="text" id="verifyCodeInput" class="verify-code-input" maxlength="6" inputmode="numeric" placeholder="Code 6 chiffres" />
          <button type="button" class="btn-primary" id="confirmEmailCodeBtn">✓ Vérifier le code</button>
        </div>
        <div class="otp-preview-box" id="otpTestPreviewBox" style="display:none;"></div>
      `;

      app.appendChild(card);

      document.getElementById("sendEmailCodeBtn")?.addEventListener("click", handleSendVerificationCode);
      document.getElementById("confirmEmailCodeBtn")?.addEventListener("click", handleVerifySubmittedCode);
      document.getElementById("verifyCodeInput")?.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleVerifySubmittedCode();
        }
      });
    }

    const _p21RenderSettings = renderSettingsView;
    renderSettingsView = function (app) {
      _p21RenderSettings(app);
      injectEmailVerificationCard(app);
    };
  </script>

  <script>
    (function () {
      const BLOCKED_CHANNEL_NAMES = ["5max"];
      const STORAGE_KEY_BLOCKED_TV = "footime_blocked_tv_channels";
      const STORAGE_KEY_TV_SORT = "footime_tv_sort_mode";

      function getBlockedChannels() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_BLOCKED_TV) || "[]");
          const merged = new Set([
            ...BLOCKED_CHANNEL_NAMES.map(x => String(x).toLowerCase().trim()),
            ...(Array.isArray(saved) ? saved.map(x => String(x).toLowerCase().trim()) : [])
          ]);
          return [...merged].filter(Boolean);
        } catch {
          return [...BLOCKED_CHANNEL_NAMES];
        }
      }

      function isBlockedChannelName(name) {
        const clean = String(name || "").toLowerCase().trim();
        if (!clean) return false;
        return getBlockedChannels().some(b => clean === b || clean.includes(b));
      }

      function purgeBlockedChannelsFromStateAndDom() {
        const blocked = getBlockedChannels();
        if (typeof ST !== "undefined" && Array.isArray(ST.channels)) {
          ST.channels = ST.channels.filter(ch => !isBlockedChannelName(ch?.name || ch?.title || ""));
        }
        if (typeof ST !== "undefined" && ST.favs && Array.isArray(ST.favs.channels)) {
          ST.favs.channels = ST.favs.channels.filter(ch => !isBlockedChannelName(ch?.name || ch?.title || ""));
        }

        const app = document.getElementById("app");
        if (!app) return;
        app.querySelectorAll(".card, .tv-card, .channel-card").forEach(card => {
          const txt = (card.textContent || "").toLowerCase();
          if (blocked.some(b => txt.includes(b))) {
            card.remove();
          }
        });
      }

      function sortVisibleChannelsGrid(mode) {
        const app = document.getElementById("app");
        const grid = app?.querySelector(".grid, .tv-grid, .channels-grid");
        if (!grid) return;
        const cards = [...grid.children];
        if (!cards.length) return;

        cards.sort((a, b) => {
          const ta = (a.textContent || "").trim().toLowerCase();
          const tb = (b.textContent || "").trim().toLowerCase();
          if (mode === "tn_first") {
            const aTn = /\btn\b|tunisia|watania|hannibal|nessma/i.test(ta) ? 0 : 1;
            const bTn = /\btn\b|tunisia|watania|hannibal|nessma/i.test(tb) ? 0 : 1;
            if (aTn !== bTn) return aTn - bTn;
          }
          if (mode === "sports_first") {
            const aSp = /sport|bein|canal\+|football|soccer/i.test(ta) ? 0 : 1;
            const bSp = /sport|bein|canal\+|football|soccer/i.test(tb) ? 0 : 1;
            if (aSp !== bSp) return aSp - bSp;
          }
          return ta.localeCompare(tb);
        });

        cards.forEach(c => grid.appendChild(c));
      }

      function injectChannelsOrganizerBar() {
        if (typeof ST === "undefined" || ST.tab !== "channels") return;
        const app = document.getElementById("app");
        const anchor = document.getElementById("channelKeywordsRow") || app?.querySelector(".tv-bar");
        if (!app || !anchor || document.getElementById("tvOrganizerBar")) return;

        const savedSort = localStorage.getItem(STORAGE_KEY_TV_SORT) || "default";
        const bar = document.createElement("div");
        bar.id = "tvOrganizerBar";
        bar.className = "tv-organizer-bar";
        bar.innerHTML = `
          <div>
            <strong>📺 Chaînes TV Organisées</strong> • <span>5Max masquée</span>
          </div>
          <div class="tv-organizer-actions">
            <select id="tvSortSelect" class="field-select" style="padding:5px 10px;font-size:12px;">
              <option value="default" ${savedSort === "default" ? "selected" : ""}>Ordre par défaut</option>
              <option value="tn_first" ${savedSort === "tn_first" ? "selected" : ""}>🇹🇳 Tunisie en premier</option>
              <option value="sports_first" ${savedSort === "sports_first" ? "selected" : ""}>⚽ Sports en premier</option>
              <option value="az" ${savedSort === "az" ? "selected" : ""}>A → Z</option>
            </select>
            <button type="button" class="s-btn" id="recleanTvBtn">🧹 Nettoyer Logos</button>
          </div>
        `;

        anchor.insertAdjacentElement("afterend", bar);

        document.getElementById("tvSortSelect")?.addEventListener("change", e => {
          const val = e.target.value;
          localStorage.setItem(STORAGE_KEY_TV_SORT, val);
          if (val !== "default") sortVisibleChannelsGrid(val);
          else if (typeof render === "function") render();
        });

        document.getElementById("recleanTvBtn")?.addEventListener("click", () => {
          purgeBlockedChannelsFromStateAndDom();
          const curSort = localStorage.getItem(STORAGE_KEY_TV_SORT) || "default";
          if (curSort !== "default") sortVisibleChannelsGrid(curSort);
          if (typeof showToast === "function") showToast("✓ Chaînes et logos organisés");
        });

        if (savedSort !== "default") {
          sortVisibleChannelsGrid(savedSort);

        if (Number.isNaN(d.getTime())) {
          return new Date().toISOString().slice(0, 10);
        }
        return d.toISOString().slice(0, 10);

      function buildDatedReplayQuery(matchObj) {

          .replace(/\b(live|stream|highlights|replay|full match)\b/gi, "")

  <script>
    (function () {
      const HIDDEN_CHANNELS_KEY = "footime_hidden_channels_v2";
      const DEFAULT_HIDDEN = ["5max"];

      function loadHiddenChannelsSet() {
        try {
          const arr = JSON.parse(localStorage.getItem(HIDDEN_CHANNELS_KEY) || "[]");
          return new Set([
            ...DEFAULT_HIDDEN,
            ...(Array.isArray(arr) ? arr.map(s => String(s).toLowerCase().trim()).filter(Boolean) : [])
          ]);
        } catch {
          return new Set(DEFAULT_HIDDEN);
        }
      }

      function saveHiddenChannelsSet(setObj) {
        try {
          localStorage.setItem(HIDDEN_CHANNELS_KEY, JSON.stringify([...setObj]));
        } catch {}
      }

      function applyHiddenChannelsFilter() {
        const hiddenSet = loadHiddenChannelsSet();
        if (typeof ST !== "undefined" && Array.isArray(ST.channels)) {
          ST.channels = ST.channels.filter(ch => {
            const nm = String(ch?.name || ch?.title || "").toLowerCase().trim();
            return ![...hiddenSet].some(h => nm === h || nm.includes(h));
          });
        }

        const app = document.getElementById("app");
        if (!app) return;
        app.querySelectorAll(".card, .tv-card, .channel-card").forEach(card => {
          const txt = (card.textContent || "").toLowerCase();
          const shouldHide = [...hiddenSet].some(h => txt.includes(h));
          if (shouldHide) card.remove();
        });
      }

      function filterCardsByKeyword(kw) {
        const q = String(kw || "").trim().toLowerCase();
        const app = document.getElementById("app");
        if (!app) return;
        app.querySelectorAll(".card, .tv-card, .channel-card").forEach(card => {
          if (!q) {
            card.style.display = "";

          const txt = (card.textContent || "").toLowerCase();

          Boolean(document.querySelector('#navPills .nav-btn.active[data-tab="channels"]'));
        if (!isTvTab) return;

        const app = document.getElementById("app");
        if (!app || document.getElementById("tvSmartConsoleBar")) return;

        const bar = document.createElement("div");
        bar.id = "tvSmartConsoleBar";
        bar.className = "tv-smart-console";
        bar.innerHTML = `
          <div class="tv-console-group">
            <strong>⚡ Contrôle Chaînes</strong>

            <button type="button" class="s-btn" id="tvHideChannelPromptBtn">🚫 Masquer nom</button>
            <button type="button" class="s-btn" id="tvResetHiddenBtn">↺ Réinitialiser masquées</button>
          </div>
        `;

        if (topAnchor) topAnchor.insertAdjacentElement("beforebegin", bar);
        else app.prepend(bar);

        const qInp = document.getElementById("tvLocalQuickSearch");
        qInp?.addEventListener("input", () => filterCardsByKeyword(qInp.value));

        document.getElementById("tvFilterSportBtn")?.addEventListener("click", () => {
          if (qInp) qInp.value = "sport";
          filterCardsByKeyword("sport");
        });

        document.getElementById("tvFilterNewsBtn")?.addEventListener("click", () => {
          if (qInp) qInp.value = "news";
          filterCardsByKeyword("news");
        });

        document.getElementById("tvFilterTnBtn")?.addEventListener("click", () => {
          if (qInp) qInp.value = "tunisia";
          filterCardsByKeyword("tunisia");
        });

        document.getElementById("tvHideChannelPromptBtn")?.addEventListener("click", () => {
          const targetName = prompt("Entre le nom de la chaîne à masquer (ex: 10 bold) :");
          if (!targetName || !targetName.trim()) return;
          const s = loadHiddenChannelsSet();
          s.add(targetName.trim().toLowerCase());
          saveHiddenChannelsSet(s);
          applyHiddenChannelsFilter();
          document.getElementById("tvSmartConsoleBar")?.remove();
          injectSmartChannelsConsole();
          if (typeof showToast === "function") showToast(`✓ Chaîne "${targetName.trim()}" masquée`);
        });

        document.getElementById("tvResetHiddenBtn")?.addEventListener("click", () => {
          saveHiddenChannelsSet(new Set(DEFAULT_HIDDEN));
          applyHiddenChannelsFilter();
          document.getElementById("tvSmartConsoleBar")?.remove();
          injectSmartChannelsConsole();
          if (typeof showToast === "function") showToast("✓ Liste des chaînes masquées réinitialisée");
        });

      if (typeof render === "function") {

          _prevPartBRender();
          applyHiddenChannelsFilter();
          injectSmartChannelsConsole();
        };
      }

      document.addEventListener("DOMContentLoaded", () => {
        applyHiddenChannelsFilter();
        injectSmartChannelsConsole();
