<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARENA LIVE — Live Scores & Fixtures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-orb bg-orb-crimson" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-amber" aria-hidden="true"></div>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#matches" class="brand" id="brandLink">
        <span class="brand-mark">ARENA</span>
        <span class="brand-accent">LIVE</span>
      </a>

      <nav class="nav-links" aria-label="Primary Navigation">
        <a href="#home" class="nav-link" data-route="home">Home</a>
        <a href="#live" class="nav-link" data-route="live">
          <span class="live-dot"></span>
          Live
        </a>
        <a href="#matches" class="nav-link active" data-route="matches">Matches</a>
      </nav>

      <div class="topbar-meta">
        <span class="quota-pill" id="quotaBadge">Quota: --</span>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="page-header">
      <div class="title-group">
        <span class="title-bar" aria-hidden="true"></span>
        <div>
          <h1 class="page-title" id="viewTitle">Matches</h1>
          <p class="page-subtitle" id="viewSubtitle">Real-time fixtures, live scores, and competition filters</p>
        </div>
      </div>

      <div class="date-controls">
        <button type="button" class="icon-btn" id="prevDayBtn" title="Previous day" aria-label="Previous day">&lt;</button>
        <div class="date-input-wrap">
          <input type="date" id="datePicker" class="date-input" aria-label="Select date" />
          <span class="date-display" id="dateDisplay">--/--/----</span>
        </div>
        <button type="button" class="icon-btn" id="nextDayBtn" title="Next day" aria-label="Next day">&gt;</button>
        <button type="button" class="btn-secondary" id="todayBtn">Today</button>
      </div>
    </section>

    <section class="filters-panel" aria-label="Match Filters">
      <div class="search-row">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search a team, league, or country..."
            autocomplete="off"
          />
          <button type="button" class="clear-btn hidden" id="clearSearchBtn" aria-label="Clear search">✕</button>
        </div>
      </div>

      <div class="chips-row" id="statusChips" role="group" aria-label="Match status filter">
        <button type="button" class="chip active" data-status="all">All</button>
        <button type="button" class="chip" data-status="live">
          <span class="chip-live-dot"></span>
          Live now
        </button>
        <button type="button" class="chip" data-status="upcoming">Upcoming</button>
        <button type="button" class="chip" data-status="finished">Finished</button>
      </div>

      <div class="chips-row" id="featuredLeagueChips" role="group" aria-label="Featured leagues filter">
        <button type="button" class="chip active" data-featured="all">All</button>
        <button type="button" class="chip" data-featured="tunisia">🇹🇳 Tunisia</button>
        <button type="button" class="chip" data-featured="ucl">Champions League</button>
        <button type="button" class="chip" data-featured="uel">Europa League</button>
        <button type="button" class="chip" data-featured="epl">Premier League</button>
        <button type="button" class="chip" data-featured="laliga">La Liga</button>
        <button type="button" class="chip" data-featured="seriea">Serie A</button>
        <button type="button" class="chip" data-featured="bundesliga">Bundesliga</button>
        <button type="button" class="chip" data-featured="ligue1">Ligue 1</button>
        <button type="button" class="chip" data-featured="africa">Africa</button>
      </div>

      <div class="comp-select-row">
        <label for="competitionSelect" class="sr-only">Competition</label>
        <select id="competitionSelect" class="comp-select">
          <option value="__ALL__">All competitions (0)</option>
        </select>
      </div>
    </section>

    <div class="status-bar">
      <div class="matches-count" id="matchesCount">0 matches</div>
      <div class="updated-time" id="updatedTime">Updated --:--</div>
    </div>

    <div id="stateContainer" class="state-container hidden"></div>
    <div id="matchesList" class="matches-list"></div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© 2026 ARENA LIVE. Scores and fixtures only. We do not host or stream any match: for viewing, we point you to the official broadcasters.</span>
    </div>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
