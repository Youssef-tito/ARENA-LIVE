<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#07080b" />
  <title>Arena Live — بث مباشر للمباريات والقنوات</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #07080b;
      --surface: #0e1016;
      --surface-2: #151822;
      --surface-hover: #1c202e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f6fb;
      --muted: #98a0b3;
      --accent: #00e676;
      --accent-soft: rgba(0, 230, 118, 0.14);
      --live: #ff2a55;
      --live-soft: rgba(255, 42, 85, 0.16);
      --radius: 14px;
      --radius-sm: 10px;
      --nav-h: 64px;
      --trans: 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline-color: var(--accent);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body.compact-cards .grid {
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Top Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: var(--nav-h);
      background: rgba(7, 8, 11, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 clamp(14px, 3vw, 32px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #00b0ff);
      color: #050709;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.9rem;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-btn {
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      transition: var(--trans);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      color: var(--text);
      background: var(--surface);
    }

    .nav-btn.active {
      color: #050709;
      background: var(--accent);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 8px var(--live);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    /* Main Container */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px clamp(14px, 3vw, 32px) 64px;
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .input, .select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      font-size: 0.9rem;
      transition: var(--trans);
    }

    .input:focus, .select:focus {
      border-color: var(--accent);
    }

    .select option {
      background: var(--surface-2);
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      color: #050709;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      transition: var(--trans);
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-ghost {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      transition: var(--trans);
    }

    .btn-ghost:hover {
      background: var(--surface-hover);
    }

    /* Chips */
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 18px;
      scrollbar-width: thin;
    }

    .chip {
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: var(--trans);
    }

    .chip.active, .chip:hover {
      color: var(--text);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    /* Grids & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--trans);
      text-align: start;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
      background: var(--surface-2);
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0b0d13;
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--muted);
      background: linear-gradient(135deg, #111520, #181d2d);
    }

    .badge-live {
      position: absolute;
      top: 10px;
      inset-inline-start: 10px;
      background: var(--live);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }

    .badge-cat {
      position: absolute;
      top: 10px;
      inset-inline-end: 10px;
      background: rgba(7, 8, 11, 0.78);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card-body {
      padding: 13px 14px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* Scoreboard Cards */
    .scores-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 14px;
    }

    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .score-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status-pill {
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .status-live {
      background: var(--live-soft);
      color: #ff6b88;
      border: 1px solid rgba(255, 42, 85, 0.35);
    }

    .status-ft {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .status-ns {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .match-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .team-name {
      font-weight: 700;
      font-size: 0.98rem;
      line-height: 1.3;
    }

    .score-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      min-width: 78px;
    }

    /* Player View */
    .player-shell {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .player-stage {
      position: relative;
      aspect-ratio: 16 / 9;
      max-height: 72vh;
      width: 100%;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .player-stage video,
    .player-stage iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .player-info {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    /* Settings */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .setting-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .setting-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .scores-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="#/matches" class="brand" data-route="matches">
      <span class="brand-badge">AL</span>
      <span>Arena Live</span>
    </a>

    <nav class="nav-tabs" aria-label="التنقل الرئيسي">
      <button class="nav-btn active" data-route="matches">
        <span class="live-dot"></span>
        <span data-i18n="nav_matches">المباريات المباشرة</span>
      </button>
      <button class="nav-btn" data-route="score">
        <span data-i18n="nav_score">النتائج (Score)</span>
      </button>
      <button class="nav-btn" data-route="channels">
        <span data-i18n="nav_channels">القنوات</span>
      </button>
      <button class="nav-btn" data-route="settings">
        <span data-i18n="nav_settings">الإعدادات</span>
      </button>
    </nav>
  </header>

  <main id="app" class="container"></main>

  <script>
    const CONFIG = {
      ppvApi: 'https://api.ppv.st/api/streams',
      iptvChannelsUrl: 'https://iptv-org.github.io/api/channels.json',
      iptvStreamsUrl: 'https://iptv-org.github.io/api/streams.json',
      pollIntervalMs: 30000
    };

    const I18N = {
      ar: {
        nav_matches: 'المباريات المباشرة',
        nav_score: 'النتائج (Score)',
        nav_channels: 'القنوات',
        nav_settings: 'الإعدادات',
        all: 'الكل',
        live_now: 'مباشر الآن',
        search_matches: 'ابحث عن مباراة أو فريق...',
        search_channels: 'ابحث عن قناة تلفزيونية...',
        refresh: 'تحديث',
        back: 'رجوع',
        watch_now: 'مشاهدة البث',
        no_data: 'لا توجد بيانات متاحة حالياً.',
        score_title: 'لوحة النتائج المباشرة (Score)',
        add_match_score: 'إضافة نتيجة مباراة',
        home_team: 'الفريق الأول',
        away_team: 'الفريق الثاني',
        home_score: 'أهداف الأول',
        away_score: 'أهداف الثاني',
        status_live: 'مباشر',
        status_ft: 'انتهت',
        status_ns: 'لم تبدأ',
        save_score: 'حفظ النتيجة',
        settings_title: 'إعدادات Arena Live',
        lang_label: 'لغة الواجهة (Language)',
        compact_label: 'شبكة بطاقات مدمجة',
        compact_desc: 'عرض عدد أكبر من البطاقات في الشاشة الواحدة',
        poll_label: 'التحديث التلقائي للمباريات والنتائج',
        poll_desc: 'تحديث حالة البث والنتائج كل 30 ثانية',
        clear_data: 'مسح البيانات المحفوظة',
        clear_desc: 'حذف النتائج المضافة محلياً والإعدادات المخزنة'
      },
      fr: {
        nav_matches: 'Matchs en direct',
        nav_score: 'Scores',
        nav_channels: 'Chaînes',
        nav_settings: 'Paramètres',
        all: 'Tous',
        live_now: 'EN DIRECT',
        search_matches: 'Rechercher un match ou une équipe...',
        search_channels: 'Rechercher une chaîne TV...',
        refresh: 'Actualiser',
        back: 'Retour',
        watch_now: 'Regarder',
        no_data: 'Aucune donnée disponible pour le moment.',
        score_title: 'Tableau des Scores',
        add_match_score: 'Ajouter un score',
        home_team: 'Équipe domicile',
        away_team: 'Équipe extérieure',
        home_score: 'Score domicile',
        away_score: 'Score extérieur',
        status_live: 'EN DIRECT',
        status_ft: 'TERMINÉ',
        status_ns: 'À VENIR',
        save_score: 'Enregistrer',
        settings_title: 'Paramètres Arena Live',
        lang_label: 'Langue de l’interface',
        compact_label: 'Grille compacte',
        compact_desc: 'Afficher plus de cartes par ligne',
        poll_label: 'Actualisation automatique',
        poll_desc: 'Mettre à jour les matchs et scores toutes les 30s',
        clear_data: 'Effacer les données locales',
        clear_desc: 'Supprimer les scores ajoutés et préférences'
      },
      en: {
        nav_matches: 'Live Matches',
        nav_score: 'Score',
        nav_channels: 'Channels',
        nav_settings: 'Settings',
        all: 'All',
        live_now: 'LIVE',
        search_matches: 'Search match or team...',
        search_channels: 'Search TV channel...',
        refresh: 'Refresh',
        back: 'Back',
        watch_now: 'Watch Stream',
        no_data: 'No data available right now.',
        score_title: 'Live Scoreboard',
        add_match_score: 'Add Match Score',
        home_team: 'Home Team',
        away_team: 'Away Team',
        home_score: 'Home Score',
        away_score: 'Away Score',
        status_live: 'LIVE',
        status_ft: 'FT',
        status_ns: 'UPCOMING',
        save_score: 'Save Score',
        settings_title: 'Arena Live Settings',
        lang_label: 'Interface Language',
        compact_label: 'Compact Card Grid',
        compact_desc: 'Show more cards per row across screens',
        poll_label: 'Auto-Refresh Live Data',
        poll_desc: 'Poll matches and scores every 30 seconds',
        clear_data: 'Clear Saved Data',
        clear_desc: 'Reset custom scores and stored settings'
      }
    };

    const DEFAULT_SCORES = [
      { id: 's1', league: 'Champions League', home: 'Real Madrid', away: 'Liverpool', hScore: 2, aScore: 1, status: 'live', minute: '68\'' },
      { id: 's2', league: 'Premier League', home: 'Arsenal', away: 'Manchester City', hScore: 1, aScore: 1, status: 'live', minute: '54\'' },
      { id: 's3', league: 'La Liga', home: 'Barcelona', away: 'Atletico Madrid', hScore: 3, aScore: 0, status: 'ft', minute: 'FT' },
      { id: 's4', league: 'Serie A', home: 'Inter Milan', away: 'Juventus', hScore: 0, aScore: 0, status: 'ns', minute: '21:00' }
    ];

    const safeStorage = {
      get(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      },
      set(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch {}
      },
      remove(key) {
        try {
          localStorage.removeItem(key);
        } catch {}
      }
    };

    const escapeHTML = (str) => String(str ?? '').replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));

    const state = {
      route: 'matches',
      playerItem: null,
      matches: [],
      selectedSport: 'All',
      matchQuery: '',
      channels: [],
      channelQuery: '',
      scores: safeStorage.get('arena_scores', DEFAULT_SCORES),
      settings: safeStorage.get('arena_settings', {
        lang: 'ar',
        compact: false,
        autoPoll: true
      }),
      hls: null,
      pollTimer: null
    };

    const t = (key) => (I18N[state.settings.lang] && I18N[state.settings.lang][key]) || I18N.ar[key] || key;

    function applyPreferences() {
      const lang = state.settings.lang || 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.body.classList.toggle('compact-cards', Boolean(state.settings.compact));

      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.route === state.route);
      });
    }

    function cleanupPlayer() {
      if (state.hls) {
        state.hls.destroy();
        state.hls = null;
      }
      const vid = document.getElementById('arena-video');
      if (vid) {
        vid.pause();
        vid.removeAttribute('src');
        vid.load();
      }
    }

    function setRoute(route, playerItem = null) {
      cleanupPlayer();
      state.route = route;
      state.playerItem = playerItem;
      applyPreferences();
      render();
    }

    async function fetchMatches() {
      try {
        const res = await fetch(CONFIG.ppvApi);
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.streams || data.data || []);
        state.matches = list.map((item, idx) => ({
          id: item.id || item.slug || `m-${idx}`,
          title: item.name || item.title || item.match || `Match #${idx + 1}`,
          category: item.category || item.sport || 'Football',
          poster: item.poster || item.image || item.thumbnail || '',
          url: item.stream_url || item.url || item.embed_url || item.iframe || '',
          isLive: item.live !== false
        }));
      } catch {
        state.matches = [];
      }
      if (state.route === 'matches') render();
    }

    async function fetchChannels() {
      if (state.channels.length) return;
      try {
        const [chRes, stRes] = await Promise.all([
          fetch(CONFIG.iptvChannelsUrl),
          fetch(CONFIG.iptvStreamsUrl)
        ]);
        const chData = await chRes.json();
        const stData = await stRes.json();

        const streamByCh = new Map();
        for (const s of stData) {
          if (s.channel && s.url && !streamByCh.has(s.channel)) {
            streamByCh.set(s.channel, s.url);
          }
        }

        state.channels = chData
          .filter((c) => !c.is_nsfw && streamByCh.has(c.id))
          .slice(0, 180)
          .map((c) => ({
            id: c.id,
            title: c.name,
            category: c.country || 'TV',
            poster: c.logo || '',
            url: streamByCh.get(c.id)
          }));
      } catch {
        state.channels = [];
      }
      if (state.route === 'channels') render();
    }

    function startPolling() {
      clearInterval(state.pollTimer);
      if (!state.settings.autoPoll) return;
      state.pollTimer = setInterval(() => {
        if (document.hidden) return;
        if (state.route === 'matches') fetchMatches();
        if (state.route === 'score') render();
      }, CONFIG.pollIntervalMs);
    }

    function renderMatchesView() {
      const sports = ['All', ...new Set(state.matches.map((m) => m.category).filter(Boolean))];
      const filtered = state.matches.filter((m) => {
        const matchesSport = state.selectedSport === 'All' || m.category === state.selectedSport;
        const matchesSearch = !state.matchQuery || m.title.toLowerCase().includes(state.matchQuery.toLowerCase());
        return matchesSport && matchesSearch;
      });

      return `
        <div class="section-head">
          <h1 class="section-title">
            <span class="live-dot"></span>
            <span>${escapeHTML(t('nav_matches'))}</span>
          </h1>
          <div class="toolbar">
            <input id="match-search" class="input" type="search" value="${escapeHTML(state.matchQuery)}" placeholder="${escapeHTML(t('search_matches'))}" />
            <button id="refresh-matches" class="btn-ghost">${escapeHTML(t('refresh'))}</button>
          </div>
        </div>

        <div class="chips">
          ${sports.map((sp) => `
            <button class="chip ${state.selectedSport === sp ? 'active' : ''}" data-sport="${escapeHTML(sp)}">
              ${sp === 'All' ? escapeHTML(t('all')) : escapeHTML(sp)}
            </button>
          `).join('')}
        </div>

        ${filtered.length ? `
          <div class="grid">
            ${filtered.map((m, i) => `
              <button class="card" data-play-index="${i}" data-play-source="matches">
                <div class="thumb-wrap">
                  ${m.poster
                    ? `<img src="${escapeHTML(m.poster)}" alt="${escapeHTML(m.title)}" loading="lazy" />`
                    : `<div class="thumb-placeholder">⚽</div>`
                  }
                  ${m.isLive ? `<span class="badge-live">${escapeHTML(t('live_now'))}</span>` : ''}
                  <span class="badge-cat">${escapeHTML(m.category)}</span>
                </div>
                <div class="card-body">
                  <div class="card-title">${escapeHTML(m.title)}</div>
                  <div class="card-meta">
                    <span>${escapeHTML(t('watch_now'))}</span>
                    <span>▶</span>
                  </div>
                </div>
              </button>
            `).join('')}
          </div>
        ` : `<div class="empty-state">${escapeHTML(t('no_data'))}</div>`}
      `;
    }

    function renderScoreView() {
      return `
        <div class="section-head">
          <h1 class="section-title">${escapeHTML(t('score_title'))}</h1>
        </div>

        <form id="score-form" class="card" style="padding:16px;margin-bottom:20px;gap:12px;">
          <strong style="font-size:0.95rem;">${escapeHTML(t('add_match_score'))}</strong>
          <div class="toolbar">
            <input name="league" class="input" placeholder="البطولة / League" required />
            <input name="home" class="input" placeholder="${escapeHTML(t('home_team'))}" required />
            <input name="hScore" class="input" type="number" min="0" style="width:95px;" placeholder="${escapeHTML(t('home_score'))}" required />
            <input name="aScore" class="input" type="number" min="0" style="width:95px;" placeholder="${escapeHTML(t('away_score'))}" required />
            <input name="away" class="input" placeholder="${escapeHTML(t('away_team'))}" required />
            <select name="status" class="select">
              <option value="live">${escapeHTML(t('status_live'))}</option>
              <option value="ns">${escapeHTML(t('status_ns'))}</option>
              <option value="ft">${escapeHTML(t('status_ft'))}</option>
            </select>
            <button type="submit" class="btn-primary">${escapeHTML(t('save_score'))}</button>
          </div>
        </form>

        <div class="scores-list">
          ${state.scores.map((sc) => {
            const badgeClass = sc.status === 'live' ? 'status-live' : (sc.status === 'ft' ? 'status-ft' : 'status-ns');
            const badgeText = sc.status === 'live' ? t('status_live') : (sc.status === 'ft' ? t('status_ft') : t('status_ns'));
            return `
              <div class="score-card">
                <div class="score-top">
                  <span>${escapeHTML(sc.league)}</span>
                  <span class="status-pill ${badgeClass}">${escapeHTML(badgeText)} • ${escapeHTML(sc.minute || '')}</span>
                </div>
                <div class="match-row">
                  <div class="team-name">${escapeHTML(sc.home)}</div>
                  <div class="score-box">${Number(sc.hScore)} - ${Number(sc.aScore)}</div>
                  <div class="team-name">${escapeHTML(sc.away)}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderChannelsView() {
      const filtered = state.channels.filter((c) =>
        !state.channelQuery || c.title.toLowerCase().includes(state.channelQuery.toLowerCase())
      );

      return `
        <div class="section-head">
          <h1 class="section-title">${escapeHTML(t('nav_channels'))}</h1>
          <div class="toolbar">
            <input id="channel-search" class="input" type="search" value="${escapeHTML(state.channelQuery)}" placeholder="${escapeHTML(t('search_channels'))}" />
          </div>
        </div>

        ${filtered.length ? `
          <div class="grid">
            ${filtered.map((ch, i) => `
              <button class="card" data-play-index="${i}" data-play-source="channels">
                <div class="thumb-wrap">
                  ${ch.poster
                    ? `<img src="${escapeHTML(ch.poster)}" alt="${escapeHTML(ch.title)}" loading="lazy" />`
                    : `<div class="thumb-placeholder">TV</div>`
                  }
                  <span class="badge-cat">${escapeHTML(ch.category)}</span>
                </div>
                <div class="card-body">
                  <div class="card-title">${escapeHTML(ch.title)}</div>
                  <div class="card-meta">
                    <span>${escapeHTML(t('watch_now'))}</span>
                    <span>▶</span>
                  </div>
                </div>
              </button>
            `).join('')}
          </div>
        ` : `<div class="empty-state">${escapeHTML(t('no_data'))}</div>`}
      `;
    }

    function renderPlayerView() {
      const item = state.playerItem;
      if (!item) return `<div class="empty-state">${escapeHTML(t('no_data'))}</div>`;

      const isM3u8 = typeof item.url === 'string' && item.url.includes('.m3u8');

      return `
        <div class="player-shell">
          <div class="player-stage">
            ${isM3u8
              ? `<video id="arena-video" controls autoplay playsinline></video>`
              : `<iframe src="${escapeHTML(item.url)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen referrerpolicy="no-referrer"></iframe>`
            }
          </div>
          <div class="player-info">
            <div>
              <h1 style="font-size:1.15rem;font-weight:800;">${escapeHTML(item.title)}</h1>
              <span style="font-size:0.85rem;color:var(--muted);">${escapeHTML(item.category || '')}</span>
            </div>
            <button id="back-btn" class="btn-ghost">← ${escapeHTML(t('back'))}</button>
          </div>
        </div>
      `;
    }

    function renderSettingsView() {
      return `
        <div class="section-head">
          <h1 class="section-title">${escapeHTML(t('settings_title'))}</h1>
        </div>
        <div class="settings-grid">
          <div class="setting-card">
            <label for="lang-select" style="font-weight:700;">${escapeHTML(t('lang_label'))}</label>
            <select id="lang-select" class="select">
              <option value="ar" ${state.settings.lang === 'ar' ? 'selected' : ''}>العربية</option>
              <option value="fr" ${state.settings.lang === 'fr' ? 'selected' : ''}>Français</option>
              <option value="en" ${state.settings.lang === 'en' ? 'selected' : ''}>English</option>
            </select>
          </div>

          <div class="setting-card">
            <div class="setting-row">
              <strong>${escapeHTML(t('compact_label'))}</strong>
              <input id="compact-toggle" type="checkbox" ${state.settings.compact ? 'checked' : ''} />
            </div>
            <p class="setting-desc">${escapeHTML(t('compact_desc'))}</p>
          </div>

          <div class="setting-card">
            <div class="setting-row">
              <strong>${escapeHTML(t('poll_label'))}</strong>
              <input id="poll-toggle" type="checkbox" ${state.settings.autoPoll ? 'checked' : ''} />
            </div>
            <p class="setting-desc">${escapeHTML(t('poll_desc'))}</p>
          </div>

          <div class="setting-card">
            <strong>${escapeHTML(t('clear_data'))}</strong>
            <p class="setting-desc">${escapeHTML(t('clear_desc'))}</p>
            <button id="reset-btn" class="btn-ghost">${escapeHTML(t('clear_data'))}</button>
          </div>
        </div>
      `;
    }

    function mountHlsIfNeeded() {
      const item = state.playerItem;
      const vid = document.getElementById('arena-video');
      if (!item || !vid || !item.url.includes('.m3u8')) return;

      if (window.Hls && window.Hls.isSupported()) {
        const hls = new window.Hls({ enableWorker: true });
        hls.loadSource(item.url);
        hls.attachMedia(vid);
        state.hls = hls;
      } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
        vid.src = item.url;
      }
    }

    function bindEvents() {
      const matchSearch = document.getElementById('match-search');
      if (matchSearch) {
        matchSearch.addEventListener('input', (e) => {
          state.matchQuery = e.target.value;
          render();
        });
      }

      const refreshBtn = document.getElementById('refresh-matches');
      if (refreshBtn) refreshBtn.addEventListener('click', fetchMatches);

      document.querySelectorAll('[data-sport]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.selectedSport = btn.dataset.sport;
          render();
        });
      });

      const channelSearch = document.getElementById('channel-search');
      if (channelSearch) {
        channelSearch.addEventListener('input', (e) => {
          state.channelQuery = e.target.value;
          render();
        });
      }

      document.querySelectorAll('[data-play-index]').forEach((card) => {
        card.addEventListener('click', () => {
          const idx = Number(card.dataset.playIndex);
          const src = card.dataset.playSource === 'channels' ? state.channels : state.matches;
          const target = src[idx];
          if (target && target.url) setRoute('player', target);
        });
      });

      const backBtn = document.getElementById('back-btn');
      if (backBtn) {
        backBtn.addEventListener('click', () => setRoute('matches'));
      }

      const scoreForm = document.getElementById('score-form');
      if (scoreForm) {
        scoreForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(scoreForm);
          const entry = {
            id: `s-${Date.now()}`,
            league: fd.get('league'),
            home: fd.get('home'),
            away: fd.get('away'),
            hScore: Number(fd.get('hScore') || 0),
            aScore: Number(fd.get('aScore') || 0),
            status: fd.get('status') || 'live',
            minute: fd.get('status') === 'live' ? 'LIVE' : (fd.get('status') === 'ft' ? 'FT' : '--:--')
          };
          state.scores = [entry, ...state.scores];
          safeStorage.set('arena_scores', state.scores);
          render();
        });
      }

      const langSelect = document.getElementById('lang-select');
      if (langSelect) {
        langSelect.addEventListener('change', (e) => {
          state.settings.lang = e.target.value;
          safeStorage.set('arena_settings', state.settings);
          applyPreferences();
          render();
        });
      }

      const compactToggle = document.getElementById('compact-toggle');
      if (compactToggle) {
        compactToggle.addEventListener('change', (e) => {
          state.settings.compact = e.target.checked;
          safeStorage.set('arena_settings', state.settings);
          applyPreferences();
        });
      }

      const pollToggle = document.getElementById('poll-toggle');
      if (pollToggle) {
        pollToggle.addEventListener('change', (e) => {
          state.settings.autoPoll = e.target.checked;
          safeStorage.set('arena_settings', state.settings);
          startPolling();
        });
      }

      const resetBtn = document.getElementById('reset-btn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          safeStorage.remove('arena_scores');
          safeStorage.remove('arena_settings');
          state.scores = [...DEFAULT_SCORES];
          state.settings = { lang: 'ar', compact: false, autoPoll: true };
          applyPreferences();
          startPolling();
          render();
        });
      }
    }

    function render() {
      const app = document.getElementById('app');
      if (state.route === 'matches') app.innerHTML = renderMatchesView();
      else if (state.route === 'score') app.innerHTML = renderScoreView();
      else if (state.route === 'channels') app.innerHTML = renderChannelsView();
      else if (state.route === 'player') app.innerHTML = renderPlayerView();
      else if (state.route === 'settings') app.innerHTML = renderSettingsView();

      bindEvents();
      if (state.route === 'player') mountHlsIfNeeded();
    }

    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const route = btn.dataset.route;
        setRoute(route);
        if (route === 'channels') fetchChannels();
      });
    });

    document.querySelector('.brand').addEventListener('click', (e) => {
      e.preventDefault();
      setRoute('matches');
    });

    applyPreferences();
    render();
    fetchMatches();
    startPolling();
  </script>
</body>
</html>
