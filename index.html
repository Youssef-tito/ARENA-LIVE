<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Live — Live Sports, Players & TV</title>
  <style>
    :root {
      --bg: #050507;
      --surface: #101116;
      --surface-2: #181a22;
      --text: #f5f7fb;
      --muted: #9aa1b2;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Top Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      background: rgba(5, 5, 7, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 14px var(--accent);
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .nav-btn:hover {
      color: var(--text);
      background: var(--surface);
    }

    .nav-btn.active {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #5b3df5);
      box-shadow: 0 6px 20px rgba(124, 92, 255, 0.35);
    }

    /* Main Container */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .accent-bar {
      width: 4px;
      height: 22px;
      border-radius: 99px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
    }

    /* Hero */
    .hero {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(135deg, #151724 0%, #0b0c12 100%);
      border: 1px solid var(--border);
      padding: 36px;
      margin-bottom: 32px;
    }

    .hero-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.14);
      color: var(--accent-2);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .hero h1 {
      font-size: clamp(1.7rem, 3.5vw, 2.6rem);
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--muted);
      max-width: 650px;
      margin-bottom: 20px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #6a48f7;
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Grids & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(124, 92, 255, 0.55);
    }

    .card-img-wrap {
      aspect-ratio: 3 / 4;
      background: var(--surface-2);
      overflow: hidden;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 14px;
    }

    .card-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .card-sub {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .live-pill {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .player-modal-body {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .player-modal-top {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 600px) {
      .player-modal-top {
        grid-template-columns: 1fr;
      }
    }

    .player-modal-photo img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--border);
      display: block;
    }

    .player-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(124, 92, 255, 0.18);
      color: #c4b5fd;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .player-modal-name {
      font-size: 1.45rem;
      margin-bottom: 8px;
    }

    .player-modal-bio {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .player-details-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .player-details-box h4 {
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .player-details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .player-details-grid div {
      background: var(--surface);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .player-details-grid span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .player-details-grid strong {
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>ARENA LIVE</span>
    </div>
    <nav class="nav" id="mainNav">
      <button class="nav-btn active" data-route="home">Home</button>
      <button class="nav-btn" data-route="sports">Sports</button>
      <button class="nav-btn" data-route="players">Players</button>
      <button class="nav-btn" data-route="live">Live TV</button>
    </nav>
  </header>

  <main class="container">
    <!-- HOME PAGE -->
    <section class="page active" id="page-home">
      <div class="hero">
        <span class="hero-badge">LIVE ARENA</span>
        <h1>Matches, Players & Live Channels</h1>
        <p>Follow live matches, explore player profiles and photos, and switch to live TV channels in one clean interface.</p>
        <div class="hero-actions">
          <button class="btn btn-primary" data-route="sports">Explore Sports</button>
          <button class="btn btn-secondary" data-route="players">Browse Players</button>
        </div>
      </div>

      <div class="section-head">
        <h2 class="section-title"><span class="accent-bar"></span>Featured Players</h2>
      </div>
      <div class="grid" id="homePlayersGrid"></div>

      <div class="section-head">
        <h2 class="section-title"><span class="accent-bar"></span>Live Sports</h2>
      </div>
      <div class="grid" id="homeSportsGrid"></div>
    </section>

    <!-- SPORTS PAGE -->
    <section class="page" id="page-sports">
      <div class="section-head">
        <h2 class="section-title"><span class="accent-bar"></span>Sports Matches</h2>
      </div>
      <div class="grid" id="sportsGrid"></div>
    </section>

    <!-- PLAYERS PAGE -->
    <section class="page" id="page-players">
      <div class="section-head">
        <h2 class="section-title"><span class="accent-bar"></span>Players</h2>
      </div>
      <div class="grid" id="playersGrid"></div>
    </section>

    <!-- LIVE TV PAGE -->
    <section class="page" id="page-live">
      <div class="section-head">
        <h2 class="section-title"><span class="accent-bar"></span>Live TV Channels</h2>
      </div>
      <div class="grid" id="liveGrid"></div>
    </section>
  </main>

  <!-- PLAYER DETAIL MODAL -->
  <div class="modal-overlay" id="playerModal">
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="Player details">
      <button class="modal-close" id="closePlayerModal" aria-label="Close">×</button>
      <div id="playerModalContent"></div>
    </div>
  </div>

  <script>
    const PLAYERS_DATA = [
      {
        id: 'p1',
        name: 'Kylian Mbappé',
        position: 'Forward',
        team: 'Real Madrid',
        nationality: 'France',
        age: '27',
        photo: 'https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=600&q=80',
        bio: 'Fast and clinical forward known for explosive pace, direct runs, and decisive goals in major competitions.'
      },
      {
        id: 'p2',
        name: 'Jude Bellingham',
        position: 'Midfielder',
        team: 'Real Madrid',
        nationality: 'England',
        age: '23',
        photo: 'https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=600&q=80',
        bio: 'Dynamic box-to-box midfielder combining vision, late penalty-box arrivals, and strong ball progression.'
      },
      {
        id: 'p3',
        name: 'Vinícius Júnior',
        position: 'Winger',
        team: 'Real Madrid',
        nationality: 'Brazil',
        age: '26',
        photo: 'https://images.unsplash.com/photo-1543326727-cf6c39e8f84c?auto=format&fit=crop&w=600&q=80',
        bio: 'Explosive left winger recognized for one-on-one dribbling, creativity, and big-match performances.'
      },
      {
        id: 'p4',
        name: 'Erling Haaland',
        position: 'Striker',
        team: 'Manchester City',
        nationality: 'Norway',
        age: '26',
        photo: 'https://images.unsplash.com/photo-1560272564-c83b66b1ad12?auto=format&fit=crop&w=600&q=80',
        bio: 'High-scoring center forward noted for physical strength, positioning, and sharp finishing.'
      }
    ];

    const SPORTS_DATA = [
      {
        id: 'm1',
        title: 'Champions League Night',
        meta: 'Football • 21:00 CET',
        status: 'LIVE',
        img: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'm2',
        title: 'NBA primetime Clash',
        meta: 'Basketball • Tonight',
        status: 'UPCOMING',
        img: 'https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'm3',
        title: 'Grand Prix Qualifying',
        meta: 'Motor Sports • Track Live',
        status: 'LIVE',
        img: 'https://images.unsplash.com/photo-1504450758481-7338eba7524a?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'm4',
        title: 'ATP Masters Final',
        meta: 'Tennis • Center Court',
        status: 'UPCOMING',
        img: 'https://images.unsplash.com/photo-1622279457486-62dcc4a431d6?auto=format&fit=crop&w=600&q=80'
      }
    ];

    const LIVE_CHANNELS = [
      {
        id: 'c1',
        title: 'Arena Sports 1 HD',
        meta: 'Live Football & Analysis',
        status: 'ON AIR',
        img: 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'c2',
        title: 'Arena Court & Hoops',
        meta: 'Basketball & Tennis 24/7',
        status: 'ON AIR',
        img: 'https://images.unsplash.com/photo-1518063319789-7217e6706b04?auto=format&fit=crop&w=600&q=80'
      }
    ];

    function renderPlayerCard(player) {
      return `
        <article class="card player-card" data-player-id="${player.id}">
          <div class="card-img-wrap">
            <img src="${player.photo}" alt="${player.name}" loading="lazy" />
          </div>
          <div class="card-body">
            <div class="card-title">${player.name}</div>
            <div class="card-sub">${player.position} • ${player.team}</div>
          </div>
        </article>
      `;
    }

    function renderMatchCard(item) {
      return `
        <article class="card">
          <div class="card-img-wrap">
            <img src="${item.img}" alt="${item.title}" loading="lazy" />
          </div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-sub">${item.meta}</div>
            <span class="live-pill">${item.status}</span>
          </div>
        </article>
      `;
    }

    function openPlayerModal(playerId) {
      const player = PLAYERS_DATA.find(p => p.id === playerId);
      if (!player) return;

      const modal = document.getElementById('playerModal');
      const content = document.getElementById('playerModalContent');

      content.innerHTML = `
        <div class="player-modal-body">
          <div class="player-modal-top">
            <div class="player-modal-photo">
              <img src="${player.photo}" alt="${player.name}" />
            </div>
            <div>
              <span class="player-badge">${player.position}</span>
              <h3 class="player-modal-name">${player.name}</h3>
              <p class="player-modal-bio">${player.bio}</p>
            </div>
          </div>
          <div class="player-details-box">
            <h4>Player Details</h4>
            <div class="player-details-grid">
              <div><span>Team</span><strong>${player.team}</strong></div>
              <div><span>Position</span><strong>${player.position}</strong></div>
              <div><span>Nationality</span><strong>${player.nationality}</strong></div>
              <div><span>Age</span><strong>${player.age}</strong></div>
            </div>
          </div>
        </div>
      `;

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePlayerModal() {
      const modal = document.getElementById('playerModal');
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    function showRoute(route) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const targetPage = document.getElementById('page-' + route);
      if (targetPage) {
        targetPage.classList.add('active');
      }

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.route === route);
      });
    }

    function initApp() {
      document.getElementById('homePlayersGrid').innerHTML = PLAYERS_DATA.map(renderPlayerCard).join('');
      document.getElementById('playersGrid').innerHTML = PLAYERS_DATA.map(renderPlayerCard).join('');
      document.getElementById('homeSportsGrid').innerHTML = SPORTS_DATA.map(renderMatchCard).join('');
      document.getElementById('sportsGrid').innerHTML = SPORTS_DATA.map(renderMatchCard).join('');
      document.getElementById('liveGrid').innerHTML = LIVE_CHANNELS.map(renderMatchCard).join('');

      document.addEventListener('click', (e) => {
        const routeBtn = e.target.closest('[data-route]');
        if (routeBtn) {
          showRoute(routeBtn.dataset.route);
          return;
        }

        const playerCard = e.target.closest('.player-card[data-player-id]');
        if (playerCard) {
          openPlayerModal(playerCard.dataset.playerId);
          return;
        }

        if (e.target.id === 'closePlayerModal' || e.target.id === 'playerModal') {
          closePlayerModal();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
