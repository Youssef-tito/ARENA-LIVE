<style>
/* ============================================================
   ARENA LIVE — SPORTS & TV CHANNELS
   Single-file CSS design system
   Palette: OLED Black #000 / Red #e50914 / White #fff
   ============================================================ */

/* ---------- Design Tokens ---------- */
:root {
  /* OLED Black surfaces */
  --bg-page: #000000;
  --bg-elevated: #050505;
  --bg-card: #0a0a0a;
  --bg-input: #111111;
  --bg-muted: #141414;
  --bg-subtle: #1a1a1a;
  --bg-panel: #050505;
  --bg-chrome: #0a0a0a;

  /* Foreground */
  --fg-primary: #ffffff;
  --fg-secondary: #b3b3b3;
  --fg-tertiary: #8a8a8a;
  --fg-disabled: #5c5c5c;

  /* Brand */
  --accent: #e50914;
  --accent-bright: #ff1a25;
  --accent-glow: rgba(229, 9, 20, 0.45);
  --accent-soft: rgba(229, 9, 20, 0.12);
  --brand-glow: rgba(255, 255, 255, 0.5);

  /* Glass */
  --glass-bg: rgba(10, 10, 10, 0.72);
  --glass-bg-strong: rgba(10, 10, 10, 0.88);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-border-strong: rgba(255, 255, 255, 0.18);

  /* Radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
  --r-2xl: 28px;
  --r-full: 9999px;

  /* Shadows */
  --shadow-card: 0 4px 24px rgba(0,0,0,0.6);
  --shadow-float: 0 12px 40px rgba(0,0,0,0.7);
  --shadow-glass-rim: 0 4px 14px rgba(0,0,0,0.45), inset 1px 1px 1px -0.5px rgba(255,255,255,0.18), inset -1px -1px 1px -0.5px rgba(255,255,255,0.08), inset 0 0 6px 4px rgba(255,255,255,0.04), 0 0 12px rgba(0,0,0,0.12);

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-io: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 0.15s;
  --dur: 0.25s;
  --dur-slow: 0.4s;

  --nav-h: 88px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  --font-sans: 'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* Light theme overrides */
html[data-theme="light"] {
  --bg-page: #f5f5f7;
  --bg-elevated: #ffffff;
  --bg-card: #ffffff;
  --bg-input: #ececef;
  --bg-muted: #e8e8ec;
  --bg-subtle: #dedee3;
  --bg-panel: #ffffff;
  --bg-chrome: #ffffff;
  --fg-primary: #0a0a0a;
  --fg-secondary: #4a4a52;
  --fg-tertiary: #6e6e78;
  --fg-disabled: #a8a8b0;
  --glass-bg: rgba(255, 255, 255, 0.78);
  --glass-bg-strong: rgba(255, 255, 255, 0.92);
  --glass-border: rgba(0, 0, 0, 0.1);
  --glass-border-strong: rgba(0, 0, 0, 0.18);
  --shadow-card: 0 4px 24px rgba(0,0,0,0.12);
  --shadow-float: 0 12px 40px rgba(0,0,0,0.18);
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; scroll-behavior: auto; touch-action: pan-y; -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
html, body { overscroll-behavior: none; }
html.no-smooth { scroll-behavior: auto; }
body {
  font-family: var(--font-sans);
  background: var(--bg-page);
  color: var(--fg-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); background-clip: padding-box; }
html[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); background-clip: padding-box; }

/* Screen-reader only */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

/* ---------- Ambient background blobs ---------- */
.ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.ambient .blob { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.08; }
.ambient .blob.b1 { width: 50vw; height: 50vw; left: -15vw; top: -10vw; background: radial-gradient(circle, var(--accent), transparent 70%); }
.ambient .blob.b2 { display: none; }
html[data-theme="light"] .ambient { display: none; }

/* ---------- App Shell ---------- */
#app { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
#main { flex: 1; width: 100%; padding-top: calc(var(--nav-h) + 4px); padding-bottom: 120px; overflow-x: clip; }
@media (max-width: 767px) { #main { padding-top: 8px; } }

/* ---------- Floating Pill Nav (Desktop) ---------- */
.top-nav {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 100; pointer-events: none;
  padding-top: var(--safe-t);
}
.top-nav .pill {
  pointer-events: auto;
  position: relative;
  display: flex; align-items: center; gap: 6px;
  height: 72px; padding: 4px 16px;
  border-radius: var(--r-2xl);
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 2px 16px rgba(0,0,0,0.3);
  max-width: calc(100vw - 24px);
}
.top-nav .brand {
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px 0 6px; margin-right: 4px;
  border-right: 1px solid var(--glass-border);
  height: 32px;
}
.top-nav .brand .logo-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #7a0408);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: #fff; font-size: 17px;
  box-shadow: 0 0 18px var(--accent-glow);
}
.top-nav .brand .logo-text {
  font-weight: 800; font-size: 18px; letter-spacing: -0.02em; color: var(--fg-primary);
}
.nav-items { position: relative; display: flex; align-items: center; gap: 2px; }
.nav-link {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 6px;
  height: 40px; padding: 0 12px;
  border-radius: var(--r-full);
  font-size: 13px; font-weight: 500;
  color: var(--fg-secondary);
  transition: color var(--dur-fast) var(--ease-io);
  white-space: nowrap;
  user-select: none;
}
.nav-link svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-link:hover { color: var(--fg-primary); }
.nav-link.active { color: var(--fg-primary); font-weight: 600; }
.nav-link .live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 0 rgba(255,255,255,0.7);
  animation: livePulse 2s infinite; margin-left: 2px;
}
@keyframes livePulse {
  0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
  70% { box-shadow: 0 0 0 6px rgba(255,255,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
}
.nav-pill-indicator {
  position: absolute; top: 8px; height: 40px;
  border-radius: var(--r-full);
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.06);
  transition: left var(--dur-slow) var(--ease-spring), width var(--dur-slow) var(--ease-spring), opacity var(--dur);
  z-index: 1; opacity: 1;
  pointer-events: none;
}
html[data-theme="light"] .nav-pill-indicator { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.04); }
.nav-actions { display: flex; align-items: center; gap: 4px; margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--glass-border); height: 32px; }
.nav-icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-secondary);
  transition: background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
  position: relative;
}
.nav-icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--fg-primary); }
.nav-icon-btn:active { transform: scale(0.92); }
html[data-theme="light"] .nav-icon-btn:hover { background: rgba(0,0,0,0.06); }
.nav-icon-btn svg { width: 18px; height: 18px; }
.nav-icon-btn .badge {
  position: absolute; top: 4px; right: 4px;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 8px; background: var(--accent);
  color: #fff; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--bg-chrome);
}

/* Hide nav links that are toggled off via settings */
.nav-link.hidden-by-settings { display: none; }

/* ---------- Mobile Bottom Nav ---------- */
.mobile-nav {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  z-index: 100; width: calc(100vw - 24px); max-width: 480px;
  padding-bottom: var(--safe-b);
  display: none;
}
.mobile-nav .pill {
  position: relative; display: flex; align-items: stretch;
  height: 60px; border-radius: var(--r-full);
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-glass-rim);
  padding: 0 4px;
}
.mobile-nav .m-link {
  flex: 1; min-height: 48px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--fg-tertiary);
  transition: color var(--dur-fast);
  position: relative; z-index: 2;
}
.mobile-nav .m-link svg { width: 20px; height: 20px; }
.mobile-nav .m-link .lbl { font-size: 10px; font-weight: 500; line-height: 1; }
.mobile-nav .m-link.active { color: var(--fg-primary); }
.mobile-nav .m-link.active svg { transform: scale(1.08); transition: transform var(--dur); }
.mobile-nav .m-link.active .lbl { font-weight: 600; }
.mobile-nav .m-link .live-dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; position: absolute; top: 8px; right: calc(50% - 14px); animation: livePulse 2s infinite; }
.mobile-nav .m-indicator {
  position: absolute; top: 6px; bottom: 6px;
  border-radius: var(--r-full);
  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.06);
  transition: left var(--dur-slow) var(--ease-spring), width var(--dur-slow) var(--ease-spring);
  z-index: 1; pointer-events: none;
}
html[data-theme="light"] .mobile-nav .m-indicator { background: rgba(0,0,0,0.06); border-color: transparent; }
html[data-theme="light"] .mobile-brand-bar .mb-icon-btn { color: #333; background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.1); }
html[data-theme="light"] .mobile-brand-bar .mb-icon-btn:hover { background: rgba(0,0,0,0.1); }

/* Mobile top brand bar */
.mobile-brand-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 90; padding: 12px 16px; padding-top: calc(12px + var(--safe-t)); background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent); pointer-events: none; display: none; align-items: center; justify-content: space-between; }
.mobile-brand-bar .mb-logo { pointer-events: auto; }
.mobile-brand-bar .mb-logo img { height: 64px; }
.mobile-brand-bar .mb-actions { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
.mobile-brand-bar .mb-icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(255,255,255,0.12); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15); cursor: pointer; transition: background 0.2s, transform 0.2s; }
.mobile-brand-bar .mb-icon-btn:hover { background: rgba(255,255,255,0.22); transform: scale(1.06); }
.mobile-brand-bar .mb-icon-btn:active { transform: scale(0.94); }
@media (max-width: 767px) {
  .top-nav { display: none; }
  .mobile-nav { display: block; }
  .mobile-brand-bar { display: flex; }
  #main { padding-top: 52px; }
}

/* ---------- Search Popup ---------- */
.search-popup {
  position: fixed; top: 78px; left: 50%;
  z-index: 140; width: 560px; max-width: calc(100vw - 24px);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--glass-border-strong);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-float);
  display: flex; flex-direction: column;
  max-height: 70vh;
  opacity: 0; transform: translateX(-50%) translateY(-12px) scale(0.98); pointer-events: none;
  transition: opacity var(--dur), transform var(--dur) var(--ease-spring);
  overflow: hidden;
}
.search-popup.open { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
.search-bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--glass-border); }
.search-bar svg.s-icon { width: 18px; height: 18px; color: var(--fg-tertiary); flex-shrink: 0; }
.search-bar input { flex: 1; height: 28px; background: transparent; border: none; color: var(--fg-primary); font-size: 15px; }
.search-bar input::placeholder { color: var(--fg-tertiary); }
.search-bar input:focus { outline: none; }
.search-bar .voice-btn, .search-bar .ai-btn { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--fg-secondary); transition: all var(--dur-fast); flex-shrink: 0; }
.search-bar .voice-btn:hover, .search-bar .ai-btn:hover { background: rgba(255,255,255,0.1); color: var(--fg-primary); }
.search-bar .voice-btn.listening { color: var(--accent); animation: voicePulse 1.2s infinite; }
@keyframes voicePulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); } 50% { box-shadow: 0 0 0 8px transparent; } }
.search-bar .ai-btn.active { background: var(--accent-soft); color: var(--accent-bright); }
.search-bar svg { width: 16px; height: 16px; }
.search-bar .ai-btn svg { width: 18px; height: 18px; }
.search-tabs { display: flex; padding: 8px 12px; gap: 4px; border-bottom: 1px solid var(--glass-border); }
.search-tab { padding: 6px 12px; border-radius: 14px; font-size: 12px; font-weight: 500; color: var(--fg-tertiary); transition: all var(--dur-fast); }
.search-tab.active { background: rgba(255,255,255,0.1); color: var(--fg-primary); }
.search-results { overflow-y: auto; padding: 8px; flex: 1; }
.search-result-item { display: flex; gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; transition: background var(--dur-fast); }
.search-result-item:hover { background: rgba(255,255,255,0.06); }
.search-result-item img { width: 44px; height: 66px; border-radius: 6px; object-fit: cover; background: var(--bg-muted); flex-shrink: 0; }
.search-result-item .sri-info { flex: 1; min-width: 0; }
.search-result-item .sri-title { font-size: 14px; font-weight: 600; line-height: 1.2; }
.search-result-item .sri-meta { font-size: 11px; color: var(--fg-tertiary); margin-top: 3px; }
.search-result-item .sri-overview { font-size: 11px; color: var(--fg-secondary); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.search-empty { padding: 40px 20px; text-align: center; color: var(--fg-tertiary); font-size: 13px; }
.search-empty svg { width: 36px; height: 36px; margin: 0 auto 12px; opacity: 0.4; }

/* Search suggestions */
.search-suggest { padding: 8px 4px 16px; display: flex; flex-direction: column; gap: 18px; }
.search-suggest-group { display: flex; flex-direction: column; gap: 8px; }
.search-suggest-label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-tertiary); padding: 0 8px; }
.search-suggest-label svg { width: 13px; height: 13px; color: var(--accent); }
.search-suggest-clear { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--fg-tertiary); text-transform: none; letter-spacing: 0; cursor: pointer; padding: 2px 8px; border-radius: 8px; background: var(--bg-muted); transition: all var(--dur-fast); }
.search-suggest-clear:hover { background: var(--bg-subtle); color: var(--accent-bright); }
.search-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 8px; }
.search-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--r-full); background: var(--bg-muted); border: 1px solid var(--glass-border); font-size: 12.5px; font-weight: 500; color: var(--fg-secondary); transition: all var(--dur-fast); }
.search-chip:hover { background: var(--accent-soft); border-color: var(--accent-glow); color: var(--fg-primary); transform: translateY(-1px); }
.search-chip svg { width: 13px; height: 13px; color: var(--accent-bright); }

.provider-banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin: 0 8px 16px; background: linear-gradient(135deg, rgba(229,9,20,0.1), rgba(229,9,20,0.02)); border: 1px solid rgba(229,9,20,0.2); border-radius: var(--r-lg); }

.provider-banner .pb-info { flex: 1; min-width: 0; }
.provider-banner .pb-name { font-size: 15px; font-weight: 700; }
.provider-banner .pb-count { font-size: 12px; color: var(--fg-tertiary); }
.provider-banner .pb-clear { padding: 8px 14px; border-radius: var(--r-full); background: var(--bg-muted); border: 1px solid var(--glass-border); font-size: 12px; font-weight: 600; color: var(--fg-secondary); transition: all var(--dur-fast); }
.provider-banner .pb-clear:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ============================================================
   SHARE + RECAP buttons
   ============================================================ */
.btn-share { background: rgba(255,255,255,0.08); color: var(--fg-primary); border: 1px solid var(--glass-border); }
.btn-share:hover { background: rgba(255,255,255,0.16); }
.recap-trigger { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--r-full); background: linear-gradient(135deg, rgba(229,9,20,0.12), rgba(229,9,20,0.04)); border: 1px solid rgba(229,9,20,0.25); color: var(--accent-bright); font-size: 13px; font-weight: 600; transition: all var(--dur-fast); }
.recap-trigger:hover { background: linear-gradient(135deg, rgba(229,9,20,0.2), rgba(229,9,20,0.08)); transform: translateY(-1px); }
.recap-trigger svg { width: 15px; height: 15px; }
.recap-card .recap-trigger { margin-bottom: 12px; }
.recap-card .recap-body { display: none; }
.recap-card.generated .recap-body { display: block; animation: pageIn 0.4s var(--ease-out); }
.recap-card .recap-loading { display: none; padding: 12px 0; }
.recap-card.loading .recap-loading { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-tertiary); }

/* ============================================================
   ATTRIBUTION strip
   ============================================================ */
.attribution { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; margin: 0 8px 24px; border-radius: var(--r-lg); background: var(--bg-elevated); border: 1px solid var(--glass-border); }
.attribution .attr-label { font-size: 11px; color: var(--fg-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px; }
.attribution .attr-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 12px; background: var(--bg-muted); border: 1px solid var(--glass-border); font-size: 11px; font-weight: 600; color: var(--fg-secondary); }
.attribution .attr-chip svg { width: 12px; height: 12px; }

/* ---------- API Layer ---------- */
const apiCache = new Map();
const apiInFlight = new Map();
async function tmdb(endpoint, params = {}, ttl = 5 * 60 * 1000) {
  const url = new URL(TMDB_BASE + endpoint);
  url.searchParams.set('language', SETTINGS.contentLang);
  Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v); });
  const key = url.toString();
  const cached = apiCache.get(key);
  if (cached && Date.now() - cached.t < ttl) return cached.v;
  if (apiInFlight.has(key)) return apiInFlight.get(key);
  const promise = (async () => {
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + TMDB_TOKEN, Accept: 'application/json' } });
    if (!res.ok) throw new Error('TMDB ' + res.status);
    const data = await res.json();
    apiCache.set(key, { v: data, t: Date.now() });
    return data;
  })();
  apiInFlight.set(key, promise);
  try { return await promise; } finally { apiInFlight.delete(key); }
}

function imgUrl(path, size = 'w500') {
  if (!path) return '';
  if (path.startsWith('http://') || path.startsWith('https://')) return path;
  return `${IMG_BASE}/${size}${path}`;
}

function placeholderImg(text = 'No Image', w = 200, h = 300) {
  return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="#141414"/><text x="50%" y="50%" fill="#5c5c5c" font-family="Arial" font-size="14" text-anchor="middle" dy=".35em">${text}</text></svg>`)}`;
}

/* ---------- Routing ---------- */
const ROUTES = ['home','series','players','live','sports','watch','more','detail'];
const LEGAL_ROUTES = ['about','privacy','terms','dmca'];

function slugify(text) {
  if (!text) return '';
  return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);
}

function parseDetailSlug(slug) {
  const match = String(slug).match(/^(\d+)(?:-.*)?$/);
  return match ? match[1] : slug;
}

function parsePath() {
  const pathname = location.pathname.replace(/^\/+|\/+$/g, '');
  const parts = pathname.split('/').filter(Boolean);
  if (parts.length === 0) return { name: 'home' };
  if (parts[0] === 'tv' && parts[1]) {
    return { name: 'detail', type: 'tv', id: parseDetailSlug(parts[1]), isAnime: false };
  }
  if (LEGAL_ROUTES.includes(parts[0])) return { name: 'legal', type: parts[0] };
  return { name: ROUTES.includes(parts[0]) ? parts[0] : 'home' };
}

function parseHash() {
  if (location.hash && location.hash.length > 1) {
    const h = location.hash.replace(/^#\/?/, '');
    const parts = h.split('/').filter(Boolean);
    if (parts.length === 0) return { name: 'home' };
    if (parts[0] === 'tv' && parts[1]) {
      return { name: 'detail', type: 'tv', id: parseDetailSlug(parts[1]), isAnime: false };
    }
    if (LEGAL_ROUTES.includes(parts[0])) return { name: 'legal', type: parts[0] };
    return { name: ROUTES.includes(parts[0]) ? parts[0] : 'home' };
  }
  return parsePath();
}

function navigate(route) {
  const path = route.startsWith('/') ? route : '/' + route;
  const parts = path.replace(/^\/+/, '').split('/');
  if (parts[0] === 'tv' && parts[1]) {
    STATE.scrollPositions[STATE.route || 'home'] = window.scrollY;
    try { history.pushState({ isDetail: true }, '', path); } catch (e) {}
    onRouteChange();
  } else if (LEGAL_ROUTES.includes(parts[0])) {
    history.pushState({ isLegal: true }, '', path);
    onRouteChange();
  } else {
    history.pushState({}, '', path);
    onRouteChange();
  }
}

function navigateDetail(type, id, title) {
  const slug = slugify(title);
  const route = slug ? `tv/${id}-${slug}` : `tv/${id}`;
  navigate(route);
}

function onRouteChange() {
  const r = parseHash();
  if (r.name === 'legal') {
    showLegal(r.type);
    updateNavActive(STATE.route || 'home');
    return;
  }
  if (r.name === 'detail') {
    loadDetail(r);
    updateNavActive(STATE.route || 'home');
    return;
  }
  if (STATE.detail) {
    document.getElementById('detailModalOverlay').classList.remove('open');
    document.body.style.overflowY = '';
    document.getElementById('detailContainer').innerHTML = '';
    STATE.detail = null;
    restoreRouteSEO();
  }

  const prevRoute = STATE.route;
  showPage(r.name, r);
  updateNavActive(r.name);
  closeAllPopups();

  if (history.state && history.state.isDetail === undefined && prevRoute !== r.name) {
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  } else {
    const savedScroll = STATE.scrollPositions[r.name];
    const targetScroll = savedScroll !== undefined ? savedScroll : 0;
    document.documentElement.scrollTop = targetScroll;
    document.body.scrollTop = targetScroll;
  }
}

function movePill(link, indicatorId) {
  const ind = document.querySelector(indicatorId);

  const parent = link.parentElement;
  const pr = parent.getBoundingClientRect();
  const lr = link.getBoundingClientRect();
  ind.style.left = (lr.left - pr.left) + 'px';
  ind.style.width = lr.width + 'px';
}

/* ---------- Reusable renderers ---------- */
function isValidItem(it) {
  if (!it) return false;
  const id = it.id ?? it.tmdb_id;
  if (id === undefined || id === null || id === '') return false;
  const title = it.title || it.name;
  if (!title || typeof title !== 'string' || !title.trim()) return false;
  if (!it.poster_path && !it.backdrop_path) return false;
  return true;
}

function hCard(item, type, opts = {}) {
  if (!isValidItem(item)) return '';
  const title = item.title || item.name;
  const img = item.backdrop_path ? imgUrl(item.backdrop_path, 'w500') : imgUrl(item.poster_path, 'w500');
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);
  const rating = item.vote_average ? item.vote_average.toFixed(1) : null;
  const progress = opts.progress ? `<div class="hc-progress" style="width:${opts.progress}%"></div>` : '';
  const remove = opts.removable ? `<div class="hc-remove" data-action="remove-continue" data-id="${item.id}" data-type="${type}">${I.x}</div>` : '';
  const loadAttr = opts.eager ? 'eager' : 'lazy';
  const fetchAttr = opts.eager ? ' high' : ' auto';
  return `<div class="h-card" data-id="${item.id}" data-type="${type}" data-media-type="${item.media_type || ''}" data-title="${escapeAttr(title)}" data-glow="${escapeAttr(img)}">
      <img class="hc-img" src="${img}" alt="${escapeAttr(title)}" loading="${loadAttr}" fetchpriority="${fetchAttr.trim()}" decoding="async" onload="this.classList.add('loaded')" onerror="this.classList.add('loaded');this.src='${placeholderImg(title, 320, 180)}'">
      <div class="hc-scrim"></div>
      ${rating ? `<div class="hc-rating">${I.star}<span>${rating}</span></div>` : ''}
      ${remove}
      <div class="hc-info"><div class="hc-title">${escapeHtml(title)}</div><div class="hc-meta">${year ? `<span>${year}</span><span class="dot"></span>` : ''}<span>Series</span></div></div>
      ${progress}
    </div>`;
}

function vCard(item, type, opts = {}) {
  if (!isValidItem(item)) return '';
  const title = item.title || item.name;
  const img = item.poster_path ? imgUrl(item.poster_path, 'w342') : imgUrl(item.backdrop_path, 'w342');
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);
  const rating = item.vote_average ? item.vote_average.toFixed(1) : null;
  const loadAttr = opts.eager ? 'eager' : 'lazy';
  const fetchAttr = opts.eager ? ' high' : ' auto';
  return `<div class="v-card" data-id="${item.id}" data-type="${type}" data-media-type="${item.media_type || ''}" data-title="${escapeAttr(title)}" style="--glow-url:url('${img}')">
      <div class="vc-poster">
        <img class="vc-img" src="${img}" alt="${escapeAttr(title)}" loading="${loadAttr}" fetchpriority="${fetchAttr.trim()}" decoding="async" onload="this.classList.add('loaded')" onerror="this.classList.add('loaded');this.src='${placeholderImg(title, 200, 300)}'">
        ${rating ? `<div class="hc-rating vc-rating">${I.star}<span>${rating}</span></div>` : ''}

      </div>
    </div>`;
}

function carousel(items, type, opts = {}) {
  if (!items || items.length === 0) return '';
  const valid = items.filter(isValidItem);
  if (valid.length === 0) return '';
  const cards = valid.map((it, i) => {
    const o = { ...opts, eager: i < 6 || opts.eager };
    return opts.horizontal ? hCard(it, type, o) : vCard(it, type, o);
  }).join('');
  const glowLayers = valid.map((it, i) => {
    const img = it.backdrop_path ? imgUrl(it.backdrop_path, 'w500') : (it.poster_path ? imgUrl(it.poster_path, 'w500') : '');
    if (!img) return '';
    return `<div class="glow-layer" data-glow-idx="${i}" style="background-image:url('${img}');"></div>`;
  }).join('');
  return `<div class="carousel">
    <div class="carousel-edge-left"></div>
    <div class="carousel-edge-right"></div>
    <div class="carousel-glow-container">${glowLayers}</div>
    <button class="carousel-arrow left" data-scroll="left">${I.chevronL}</button>
    <div class="carousel-track">${cards}</div>
    <button class="carousel-arrow right" data-scroll="right">${I.chevronR}</button>
  </div>`;
}

function section(title, items, type, opts = {}) {

    ]);
    secEl.insertAdjacentHTML('beforeend', [
      section('Sports & Competition Series', sportsSeries?.results || [], 'tv', { horizontal: true }),
      section('On The Air Now', airingTv?.results || [], 'tv', { horizontal: true }),
    ].join(''));
  } catch (e) { console.warn('extra home sections failed', e); }
  loadPersonalizedSection();
}

async function loadPersonalizedSection() {
  const secEl = document.getElementById('homeSections');
  if (!secEl) return;
  try {
    let recs = [];
    let sectionTitle = t('you_might_like');
    if (WATCHLIST.length > 0) {
      const recent = WATCHLIST[0];
      const type = 'tv';
      let sim = null;
      try {
        sim = await tmdb(`/${type}/${recent.id}/recommendations`);
      } catch { sim = null; }
      if (sim && sim.results && sim.results.length > 0) {
        recs = sim.results.filter(r => r.poster_path || r.backdrop_path).slice(0, 20);
        sectionTitle = `${t('because_you_saved')} "${recent.title}"`;
      }
    }
    if (recs.length === 0) {
      const tr = await tmdb('/trending/tv/day');
      recs = (tr.results || []).filter(r => r.backdrop_path && (r.title || r.name)).slice(0, 20);
      sectionTitle = t('trending_today');
    }
    if (recs.length > 0) {
      const html = section(sectionTitle, recs, 'tv', { horizontal: true });
      secEl.insertAdjacentHTML('afterbegin', html);
    }
  } catch (e) { console.warn('personalized section failed', e); }
}

/* ---------- Top 10 Today ---------- */
async function loadTop10() {
  const existing = document.getElementById('top10Section');
  if (existing) existing.remove();

  try {
    const data = await tmdb('/trending/tv/day');
    const items = (data.results || []).filter(r => r.poster_path && (r.title || r.name)).slice(0, 10);
    if (items.length === 0) return;
    const t10GlowLayers = items.map((it, i) => {
      const img = it.backdrop_path ? imgUrl(it.backdrop_path, 'w500') : imgUrl(it.poster_path, 'w500');
      if (!img) return '';
      return `<div class="glow-layer" data-glow-idx="${i}" style="background-image:url('${img}');"></div>`;
    }).join('');
    const html = `<div class="section" id="top10Section">
      <div class="section-head"><div class="section-title"><span class="accent-bar"></span>Top 10 Today</div></div>
      <div class="top10-carousel carousel" style="position:relative;overflow:visible;">
        <div class="carousel-edge-left"></div>
        <div class="carousel-edge-right"></div>
        <div class="carousel-glow-container">${t10GlowLayers}</div>
        <button class="carousel-arrow left" data-scroll="left" aria-label="Scroll left">${I.chevronL}</button>
        <div class="top10-list">${items.map((it, i) => {
        const title = it.title || it.name;
        const img = imgUrl(it.poster_path, 'w342');
        const year = (it.release_date || it.first_air_date || '').slice(0, 4);
        const rating = it.vote_average ? it.vote_average.toFixed(1) : null;
        const loadAttr = i < 3 ? 'eager' : 'lazy';
        const fetchAttr = i < 3 ? ' high' : ' auto';
        const bgImg = it.backdrop_path ? imgUrl(it.backdrop_path, 'w500') : img;
        return `<div class="h-card" data-id="${it.id}" data-type="tv" data-media-type="tv" data-title="${escapeAttr(title)}" data-glow="${escapeAttr(bgImg)}">
          <div class="t10-num">${i + 1}</div>
          <img class="hc-img" src="${bgImg}" alt="${escapeAttr(title)}" loading="${loadAttr}" fetchpriority="${fetchAttr.trim()}" decoding="async" onload="this.classList.add('loaded')" onerror="this.classList.add('loaded');this.src='${placeholderImg(title, 320, 180)}'">
          <div class="hc-scrim"></div>
          ${rating ? `<div class="hc-rating">${I.star}<span>${rating}</span></div>` : ''}
          <div class="hc-info"><div class="hc-title">${escapeHtml(title)}</div><div class="hc-meta">${year ? `<span>${year}</span><span class="dot"></span><span>Series</span>` : ''}</div></div>
        </div>`;
      }).join('')}</div>
        <button class="carousel-arrow right" data-scroll="right" aria-label="Scroll right">${I.chevronR}</button>
      </div>
    </div>`;

    const secEl = document.getElementById('homeSections');
    if (secEl) {
      const sections = secEl.querySelectorAll('.section');
      if (sections.length >= 2) {
        sections[1].insertAdjacentHTML('afterend', html);
      } else {
        secEl.insertAdjacentHTML('beforeend', html);
      }
    }
  } catch (e) { console.warn('Top 10 failed', e); }
}

function renderHero() {
  const el = document.getElementById('homeHero');
  const items = STATE.heroItems;
  if (items.length === 0) { el.innerHTML = ''; return; }

  const existingHero = el.querySelector('.hero');
  if (existingHero && !STATE.heroFirstRender) {
    existingHero.classList.add('hero-transitioning');
  }
  STATE.heroFirstRender = false;

  const transitionOut = existingHero ? 300 : 0;
  setTimeout(() => {
    const it = items[STATE.heroIndex];
    const type = 'tv';
    const title = it.title || it.name;
    const bg = it.backdrop_path ? imgUrl(it.backdrop_path, 'original') : '';
    const poster = it.poster_path ? imgUrl(it.poster_path, 'w500') : '';
    const year = (it.release_date || it.first_air_date || '').slice(0, 4);
    const rating = it.vote_average ? it.vote_average.toFixed(1) : null;
    const genres = (it.genre_ids || []).slice(0, 3).map(g => `<span>${(GENRE_MAP.tv || {})[g] || ''}</span>`).join('');
    el.innerHTML = `<div class="hero" style="opacity:0;">
      ${bg ? `<div class="hero-glow"><img src="${bg}" alt="" aria-hidden="true"></div>` : ''}
      <div class="hero-bg">${bg ? `<img src="${bg}" alt="${escapeAttr(title)}">` : ''}</div>
      <div class="hero-scrim"></div>
      <div class="hero-content">
        ${poster ? `<div class="hero-poster" style="background-image:url('${poster}');"><img src="${poster}" alt="${escapeAttr(title)}"></div>` : ''}
        <div class="hero-body">
          <div class="hero-badge">Arena Live • Trending Now</div>
          <h2 class="hero-title">${escapeHtml(title)}</h2>
          <div class="hero-meta">
            ${rating ? `<span class="rating">${I.star}<span>${rating}</span></span>` : ''}
            ${year ? `<span>${year}</span><span class="dot"></span>` : ''}
            <div class="genres">${genres}</div>
          </div>
          <p class="hero-desc">${escapeHtml(it.overview || 'No description available.')}</p>
          <div class="hero-actions">
            <button class="btn btn-primary" data-action="watch-hero" data-id="${it.id}" data-type="${type}">${I.play}Watch</button>
            <button class="btn btn-glass" data-action="details-hero" data-id="${it.id}" data-type="${type}" data-title="${escapeAttr(title)}">${I.info}Details</button>
            <button class="btn btn-ghost" data-action="trailer-hero" data-id="${it.id}" data-type="${type}">${I.trailer}Highlight</button>
          </div>
        </div>
      </div>
      ${items.length > 1 ? `<div class="hero-dots">${items.map((_, i) => `<div class="hero-dot ${i === STATE.heroIndex ? 'active' : ''}" data-hero-dot="${i}"></div>`).join('')}</div>` : ''}
    </div>`;
    requestAnimationFrame(() => {
      const hero = el.querySelector('.hero');
      if (hero) { hero.style.transition = 'opacity 0.4s var(--ease-out)'; hero.style.opacity = '1'; }
    });
  }, transitionOut);

  clearTimeout(STATE.heroTimer);
  if (items.length > 1) {
    STATE.heroTimer = setTimeout(() => { STATE.heroIndex = (STATE.heroIndex + 1) % items.length; renderHero(); }, 8000);
  }
}

/* ---------- Series & Players discovery with infinite scroll ---------- */
async function loadDiscoveryPage(kind, pageKey, contentId, sentinelId, sort, filters = {}, initialLoad = false) {
  if (!initialLoad && STATE.lastPageSwitch && Date.now() - STATE.lastPageSwitch < 5000) return;
  const content = document.getElementById(contentId);
  const sentinel = document.getElementById(sentinelId);
  if (STATE.pagination[pageKey] === 1 || !content.dataset.loaded) {
    content.innerHTML = '';
    content.dataset.loaded = '1';
    content.appendChild(makeSkeletonGrid());
  }
  STATE.pagination.loading[pageKey] = true;
  try {
    let endpoint;
    const params = {
      page: STATE.pagination[pageKey],
      sort_by: sort === 'top_rated' ? 'vote_average.desc' : 'popularity.desc',
    };
    if (filters.ratingMin) params['vote_average.gte'] = String(parseFloat(filters.ratingMin));
    if (filters.ratingMax) params['vote_average.lte'] = String(parseFloat(filters.ratingMax));

    if (kind === 'players') {
      endpoint = '/person/popular';
    } else {
      endpoint = sort === 'top_rated'
        ? '/tv/top_rated'
        : sort === 'on_the_air'
          ? '/tv/on_the_air'
          : sort === 'airing_today'
            ? '/tv/airing_today'
            : '/discover/tv';
      if (endpoint === '/discover/tv') {
        if (filters.genre) params.with_genres = filters.genre;
        if (filters.year) params.first_air_date_year = filters.year;
        if (filters.language) params.with_original_language = filters.language;
        params['vote_count.gte'] = 30;
      }
    }

    const data = await tmdb(endpoint, params);
    const items = (data.results || []).filter(r =>
      kind === 'players' ? Boolean(r.profile_path && r.name) : isValidItem(r)
    );
    renderDiscoveryResults(kind, pageKey, content, sentinel, items, data.page < data.total_pages);
  } catch (e) {
    console.error(e);
    content.innerHTML = `<div class="empty-state">${I.refresh}<h3>Failed to load</h3><p>Check your connection</p></div>`;
  } finally {
    STATE.pagination.loading[pageKey] = false;
  }
}
      /* ---------- Series & Players Page Loaders ---------- */
function ensureGridContainer(content, gridClass = 'card-grid') {
  let grid = content.querySelector('.' + gridClass);
  if (!grid) {
    content.innerHTML = `<div class="${gridClass}"></div>`;
    grid = content.querySelector('.' + gridClass);
  }
  return grid;
}

function renderDiscoveryResults(kind, pageKey, content, sentinel, items, hasMore) {
  if (STATE.pagination[pageKey] === 1) {
    content.innerHTML = '';
  } else {
    content.querySelectorAll('.skeleton-grid, .skeleton').forEach(el => el.remove());
  }

  if (kind === 'players') {
    const grid = ensureGridContainer(content, 'players-grid');
    if (!items.length && STATE.pagination[pageKey] === 1) {
      grid.innerHTML = `<div class="empty-state">${I.users}<h3>No players found</h3><p>Try another page or filter.</p></div>`;
      if (sentinel) sentinel.style.display = 'none';
      return;
    }
    const html = items.map((p, idx) => {
      const photo = imgUrl(p.profile_path, 'w342');
      const loadAttr = idx < 8 ? 'eager' : 'lazy';
      const knownFor = (p.known_for || [])
        .map(k => k.title || k.name)
        .filter(Boolean)
        .slice(0, 2)
        .join(' • ');
      return `<div class="player-card" data-player-id="${p.id}" data-player-name="${escapeAttr(p.name)}">
        <div class="player-photo-wrap">
          <img class="player-photo" src="${photo}" alt="${escapeAttr(p.name)}" loading="${loadAttr}" decoding="async" onload="this.classList.add('loaded')" onerror="this.classList.add('loaded');this.src='${placeholderImg(p.name, 240, 300)}'">
        </div>
        <div class="player-card-info">
          <div class="player-card-name">${escapeHtml(p.name)}</div>
          <div class="player-card-sub">${escapeHtml(knownFor || p.known_for_department || t('players'))}</div>
        </div>
      </div>`;
    }).join('');
    grid.insertAdjacentHTML('beforeend', html);
  } else {
    const grid = ensureGridContainer(content, 'card-grid');
    if (!items.length && STATE.pagination[pageKey] === 1) {
      grid.innerHTML = `<div class="empty-state">${I.tv}<h3>No series found</h3><p>Try adjusting your filters.</p></div>`;
      if (sentinel) sentinel.style.display = 'none';
      return;
    }
    const html = items.map((it, idx) => vCard(it, 'tv', { eager: idx < 8 })).join('');
    grid.insertAdjacentHTML('beforeend', html);
  }

  if (hasMore) {
    STATE.pagination[pageKey] += 1;
    if (sentinel) sentinel.style.display = 'flex';
  } else if (sentinel) {
    sentinel.style.display = 'none';
  }
}

async function loadSeriesPage(initial = true) {
  if (initial) STATE.pagination.series = 1;
  await loadDiscoveryPage(
    'series',
    'series',
    'seriesContent',
    'seriesSentinel',
    STATE.sort.series || SETTINGS.defaultSort || 'popular',
    STATE.filters.series || {},
    initial
  );
}

async function loadPlayersPage(initial = true) {
  if (initial) STATE.pagination.players = 1;
  await loadDiscoveryPage(
    'players',
    'players',
    'playersContent',
    'playersSentinel',
    'popular',
    {},
    initial
  );
}

/* ---------- Player Modal: Photo + Player Details ---------- */
async function openPlayerModal(playerId, fallbackName = '') {
  const modal = document.getElementById('actorModal');
  const body = document.getElementById('actorModalBody');
  const detailBox = document.getElementById('playerDetailBody');
  if (!modal || !body) return;

  body.innerHTML = `<div class="player-modal-loading">${skeletonsCarousel(2)}</div>`;
  if (detailBox) detailBox.innerHTML = '';
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';

  try {
    const person = await tmdb(`/person/${playerId}`);
    const name = person.name || fallbackName || 'Player';
    const photo = person.profile_path
      ? imgUrl(person.profile_path, 'h632')
      : placeholderImg(name, 300, 420);
    const birthday = person.birthday || '—';
    const birthplace = person.place_of_birth || '—';
    const dept = person.known_for_department || t('players');
    const bio = person.biography || 'No player profile biography available.';

    body.innerHTML = `
      <div class="player-modal-header">
        <div class="player-modal-photo">
          <img src="${photo}" alt="${escapeAttr(name)}" onerror="this.src='${placeholderImg(name, 300, 420)}'">
        </div>
        <div class="player-modal-meta">
          <span class="player-badge">${escapeHtml(dept)}</span>
          <h3 class="player-modal-name">${escapeHtml(name)}</h3>
          <p class="player-modal-bio">${escapeHtml(bio)}</p>
        </div>
      </div>
    `;

    if (detailBox) {
      detailBox.innerHTML = `
        <div class="player-details-card">
          <h4>${escapeHtml(t('player_details'))}</h4>
          <div class="player-details-grid">
            <div><span>${escapeHtml(t('position'))}</span><strong>${escapeHtml(dept)}</strong></div>
            <div><span>Born</span><strong>${escapeHtml(birthday)}</strong></div>
            <div><span>${escapeHtml(t('nationality'))}</span><strong>${escapeHtml(birthplace)}</strong></div>
            <div><span>Popularity</span><strong>${person.popularity ? person.popularity.toFixed(1) : '—'}</strong></div>
          </div>
        </div>
      `;
    }
  } catch (err) {
    console.error('Player modal load error:', err);
    body.innerHTML = `<div class="empty-state">${I.users}<h3>Could not load player details</h3><p>${escapeHtml(fallbackName)}</p></div>`;
  }
}

/* ---------- Global Click Delegation for Players & Modals ---------- */
document.addEventListener('click', (e) => {
  const playerCard = e.target.closest('.player-card[data-player-id]');
  if (playerCard) {
    e.preventDefault();
    openPlayerModal(playerCard.dataset.playerId, playerCard.dataset.playerName || '');
    return;
  }

  const closeBtn = e.target.closest('[data-close-modal]');
  if (closeBtn) {
    const targetId = closeBtn.getAttribute('data-close-modal');
    const targetModal = document.getElementById(targetId);
    if (targetModal) {
      targetModal.classList.remove('open');
      document.body.style.overflow = '';
    }
  }
});

/* ---------- Startup Hook ---------- */
document.addEventListener('DOMContentLoaded', () => {
  applyTranslations();
  updateNavActive(STATE.route || 'home');
});
</script>
