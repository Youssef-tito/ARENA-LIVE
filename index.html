<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARENA LIVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="logo" href="#">ARENA <span>LIVE</span></a>

  <nav>
    <button data-filter="all">All</button>
    <button data-filter="live">LIVE</button>
    <button data-filter="upcoming">Upcoming</button>
    <button data-filter="finished">Finished</button>
  </nav>

  <div class="tools">
    <button id="themeBtn">☀</button>
    <select id="language">
      <option value="en">EN</option>
      <option value="fr">FR</option>
      <option value="ar">AR</option>
    </select>
  </div>
</header>

<main>
  <section class="hero">
    <p>THE WORLD OF FOOTBALL</p>
    <h1>Every Match.<br><span>One Arena.</span></h1>
    <p>Live scores, fixtures and official replays.</p>
  </section>

  <section class="toolbar">
    <input type="date" id="matchDate">
    <input type="search" id="search" placeholder="Search teams or leagues...">
  </section>

  <section class="matches-section">
    <h2 id="sectionTitle">All Matches</h2>
    <div id="matches">
      <p class="loading">Loading matches...</p>
    </div>
  </section>
</main>

<div id="playerModal" class="modal">
  <div class="modal-content">
    <button id="closePlayer" class="close">✕</button>
    <h2 id="matchTitle">Match</h2>
    <div class="player-tabs">
      <button data-player="live">LIVE</button>
      <button data-player="replay">REPLAY</button>
    </div>
    <div id="videoPlayer">
      <p>Select a match source.</p>
    </div>
    <a id="officialLink" target="_blank" rel="noopener noreferrer" hidden>
      Open official source
    </a>
  </div>
</div>

<script src="config.js"></script>
<script src="sources.js"></script>
<script src="app.js"></script>
</body>
</html>
